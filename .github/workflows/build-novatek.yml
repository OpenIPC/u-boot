name: Build novatek

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-novatek.  Code changes reach it through
  # workflow_call from the caller on openipc-novatek, which passes the revision
  # to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-novatek.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-novatek revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to this repo's Novatek release
        type: boolean
        default: false
      publish:
        description: Publish to OpenIPC/firmware latest and report to openipc.org
        type: boolean
        default: false

# The shape of build-hisilicon.yml:
#   build (matrix, every SoC) -> qemu (prep) -> qemu_smoke (hard gate) ->
#   release (own, `release` input) + publish (OpenIPC/firmware latest +
#   openipc.org report, `publish` input).
# build.sh takes SoCs as arguments; the matrix calls it with one SoC per leg.

jobs:
  # Resolve the openipc-novatek revision this run builds from. The workflow
  # lives on the openipc branch, so github.sha is the openipc commit, not
  # the revision being built; release provenance must name the commit that
  # build.sh actually compiled.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-novatek' }}
          path: src

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # image: the file released; limit_kb: the slot it is written to
        # (the camera dies' whole 256 KiB boot partition, loader and device
        # tree included; on the NVRs U-Boot's slot in the board's own
        # layout, behind the board's loader and BL31).
        include:
          - { soc: nt98560, image: nor, limit_kb: 256 }
          - { soc: nt98561, image: nor, limit_kb: 256 }
          - { soc: nt98562, image: nor, limit_kb: 256 }
          - { soc: nt98566, image: nor, limit_kb: 256 }
          - { soc: nt98520, image: nor, limit_kb: 256 }
          - { soc: nt98522, image: nor, limit_kb: 256 }
          - { soc: nt98523, image: nor, limit_kb: 256 }
          - { soc: nt98525, image: nor, limit_kb: 256 }
          - { soc: nt98528, image: nor, limit_kb: 256 }
          - { soc: nt98529, image: nor, limit_kb: 256 }
          - { soc: nt98532, image: nor, limit_kb: 256 }
          - { soc: nt98533, image: nor, limit_kb: 256 }
          - { soc: nt98321, image: nor, limit_kb: 256 }
          - { soc: nt98323, image: nor, limit_kb: 256 }
          - { soc: nt98332, image: nor, limit_kb: 128 }
          - { soc: nt98633, image: nand, limit_kb: 896 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release and openipc.org report name,
          # even if the branch moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi gcc-arm-none-eabi \
              gcc-aarch64-linux-gnu device-tree-compiler \
              bison flex bc libssl-dev python3
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done

      - name: Build ${{ matrix.soc }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        run: |
          # An image larger than its slot overflows into what follows (the
          # environment) and bricks the device on upgrade. Compare bytes:
          # rounding down to KiB would pass an image up to 1023 bytes over.
          f='output/u-boot-${{ matrix.soc }}-${{ matrix.image }}.bin'
          test -f "$f" || { echo "missing $f" >&2; exit 1; }
          size=$(stat -c %s "$f")
          limit=$(( ${{ matrix.limit_kb }} * 1024 ))
          echo "- $f: [${size}/${limit} bytes]"
          if [ "$size" -gt "$limit" ]; then
            echo "-- size exceeded by: $((size - limit)) bytes" >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: output/u-boot-${{ matrix.soc }}-${{ matrix.image }}.bin
          if-no-files-found: error

      # The NVR images are U-Boot's slot alone and need the board's own
      # loader and BL31 around them; build.sh also writes a boot area the
      # emulator's stand-in loader starts, for the smoke test only (never
      # released: its artifact name is outside the release's u-boot-*).
      - name: Upload the emulator image
        if: ${{ hashFiles(format('output/u-boot-{0}-qemu.bin', matrix.soc)) != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: qemu-image-${{ matrix.soc }}
          path: output/u-boot-${{ matrix.soc }}-qemu.bin

  # Build qemu-system-arm once and share it with every smoke leg.
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm and qemu-system-aarch64
        run: |
          git clone --depth 1 --branch master \
            https://github.com/OpenIPC/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          cp qemu-src/build/qemu-system-aarch64 "$GITHUB_WORKSPACE/qemu-aarch64"
          chmod +x "$GITHUB_WORKSPACE"/qemu-arm "$GITHUB_WORKSPACE"/qemu-aarch64

      - name: Upload qemu
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: |
            qemu-arm
            qemu-aarch64

  # QEMU smoke test -- boots each freshly-built image from flash through
  # qemu-hisilicon's nt98562/nt98566 machines, which do the loader's job
  # (they do not train DDR, so they do not run it): read the device tree
  # at 0x10000, unpack U-Boot from its BCL1 container as the tree says,
  # fill SHMINFO and start it; then assert it reaches the autoboot prompt.
  # Both SoCs have a machine model, so both are a hard gate on release.
  #
  # The second boot must load the environment the first saved, which
  # proves the driver's writes land where its reads find them.
  qemu_smoke:
    needs: [build, qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # machine: the qemu-hisilicon machine (the NT98520 and NT98522
        # have none: they run on the NT98525's and NT98523's, the same
        # dies); qemu: arm or aarch64; artifact/file: the image; mib: the
        # flash it sits at the start of; args: extra qemu arguments.
        include:
          - { soc: nt98560, machine: nt98560, qemu: arm, artifact: u-boot-nt98560, file: u-boot-nt98560-nor.bin, mib: 8, args: "" }
          - { soc: nt98561, machine: nt98561, qemu: arm, artifact: u-boot-nt98561, file: u-boot-nt98561-nor.bin, mib: 8, args: "" }
          - { soc: nt98562, machine: nt98562, qemu: arm, artifact: u-boot-nt98562, file: u-boot-nt98562-nor.bin, mib: 8, args: "" }
          - { soc: nt98566, machine: nt98566, qemu: arm, artifact: u-boot-nt98566, file: u-boot-nt98566-nor.bin, mib: 8, args: "" }
          - { soc: nt98520, machine: nt98525, qemu: arm, artifact: u-boot-nt98520, file: u-boot-nt98520-nor.bin, mib: 8, args: "" }
          - { soc: nt98522, machine: nt98523, qemu: arm, artifact: u-boot-nt98522, file: u-boot-nt98522-nor.bin, mib: 8, args: "" }
          - { soc: nt98523, machine: nt98523, qemu: arm, artifact: u-boot-nt98523, file: u-boot-nt98523-nor.bin, mib: 8, args: "" }
          - { soc: nt98525, machine: nt98525, qemu: arm, artifact: u-boot-nt98525, file: u-boot-nt98525-nor.bin, mib: 8, args: "" }
          - { soc: nt98528, machine: nt98528, qemu: arm, artifact: u-boot-nt98528, file: u-boot-nt98528-nor.bin, mib: 8, args: "" }
          - { soc: nt98529, machine: nt98529, qemu: arm, artifact: u-boot-nt98529, file: u-boot-nt98529-nor.bin, mib: 8, args: "" }
          - { soc: nt98532, machine: nt98532, qemu: arm, artifact: u-boot-nt98532, file: u-boot-nt98532-nor.bin, mib: 8, args: "" }
          - { soc: nt98533, machine: nt98533, qemu: arm, artifact: u-boot-nt98533, file: u-boot-nt98533-nor.bin, mib: 8, args: "" }
          - { soc: nt98321, machine: nt98321, qemu: arm, artifact: u-boot-nt98321, file: u-boot-nt98321-nor.bin, mib: 8, args: "" }
          - { soc: nt98323, machine: nt98323, qemu: arm, artifact: u-boot-nt98323, file: u-boot-nt98323-nor.bin, mib: 8, args: "" }
          - { soc: nt98332, machine: nt98332, qemu: aarch64, artifact: qemu-image-nt98332, file: u-boot-nt98332-qemu.bin, mib: 16, args: "-smp 2" }
          - { soc: nt98633, machine: nt98633, qemu: aarch64, artifact: qemu-image-nt98633, file: u-boot-nt98633-qemu.bin, mib: 128, args: "-smp 4" }
    steps:
      - name: Download qemu
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download the image
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Install QEMU runtime deps
        run: |
          # qemu is built once in the `qemu` job and downloaded here, so
          # this leg needs the shared libraries it links against.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0
          chmod +x ./qemu-arm ./qemu-aarch64
          if ldd ./qemu-${{ matrix.qemu }} | grep -qi 'not found'; then
            echo "qemu-${{ matrix.qemu }} has unresolved libraries:" >&2
            ldd ./qemu-${{ matrix.qemu }} >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 3
        run: |
          soc='${{ matrix.soc }}'
          UBOOT='${{ matrix.file }}'
          test -f "$UBOOT"
          echo "booting $UBOOT on ${{ matrix.machine }}"
          # The image at the start of the flash, the rest erased
          python3 - "$UBOOT" /tmp/flash.bin ${{ matrix.mib }} <<'PY'
          import sys
          img = bytearray(b'\xff' * (int(sys.argv[3]) << 20))
          u = open(sys.argv[1], 'rb').read()
          img[:len(u)] = u
          open(sys.argv[2], 'wb').write(img)
          PY
          FLASH="-M ${{ matrix.machine }},flash-file=/tmp/flash.bin ${{ matrix.args }}"
          # Two boots: the first finds an erased environment and saves the
          # default one; the second must load it back.
          for boot in 1 2; do
            mkfifo /tmp/uart.in /tmp/uart.out
            ./qemu-${{ matrix.qemu }} $FLASH \
              -nographic -serial pipe:/tmp/uart \
              -monitor none > /tmp/qemu.log 2>&1 &
            QEMU_PID=$!
            # Wait for the autoboot prompt, not the banner: the banner prints
            # before the board init that can hang. Up to 30 s.
            cat /tmp/uart.out > /tmp/uboot$boot.txt &
            CAT_PID=$!
            for i in $(seq 1 60); do
              grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt 2>/dev/null && break
              sleep 0.5
            done
            kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
            wait 2>/dev/null || true
            rm -f /tmp/uart.in /tmp/uart.out
            echo "== boot $boot: captured u-boot output =="
            cat /tmp/uboot$boot.txt
            echo
            if ! grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt; then
              echo "FAIL: boot $boot did not reach the autoboot prompt"
              echo
              echo "== qemu stderr =="
              tail -40 /tmp/qemu.log || true
              exit 1
            fi
          done
          if grep -q 'bad CRC' /tmp/uboot2.txt; then
            echo "FAIL: the environment saved on the first boot did not land"
            exit 1
          fi
          echo "PASS: u-boot reached the autoboot prompt, and its saved environment survived a reset"

  # Mirror every built image to this repository's own Novatek release.
  release:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: novatek
          name: Novatek
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # Publish every image to the OpenIPC/firmware `latest` release and tell
  # openipc.org what was uploaded. openipc.org keeps, per file name, the
  # newest uboot build that names it, so this run adds or refreshes the
  # u-boot-nt985* names and leaves the other repositories' files alone. The
  # concurrency group, shared with build-hisilicon.yml, keeps a second run
  # from uploading between this run's upload and its report.
  publish:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-firmware-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          # Releases API occasionally returns 502/503. Retry with backoff:
          # 10s, 20s, 30s, 40s -- total ~100s before giving up.
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          find artifacts -type f -name '*.bin' | sort | while read -r f; do
            echo "publishing $f"
            upload "$f"
          done

      # The push script is OpenIPC/firmware's, at a fixed commit: the only
      # code this job checks out, since it holds an id-token.
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: 7fa63ce694cb5d27c19d4f19058ba2c044849db4
          sparse-checkout: .github/scripts
          path: firmware

      # The contract is PUSH.md in OpenIPC/website (source `uboot`, release
      # `latest`, one id per run). The digests are of the files uploaded
      # above, hashed here, so the push describes exactly those bytes.
      - name: Report to openipc.org
        env:
          NVT_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -eu
          mkdir published
          find artifacts -type f -name '*.bin' -exec cp {} published/ \;
          python3 firmware/.github/scripts/push_build.py \
            --source uboot \
            --build-id "uboot-novatek-$(date -u +%Y%m%dT%H%M%SZ)-${NVT_SHA::7}" \
            --release latest \
            --sha "$NVT_SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --assets 'published/*.bin'
