name: CI

# The build lives in build-rockchip.yml on the openipc branch (the default
# branch, so it can be dispatched). GitHub runs a pull request's workflows
# from the PR's own tree, so this branch needs this caller for its pushes
# and pull requests to be built and smoke-tested at all.
# It never releases: that workflow only uploads on workflow_dispatch.
on:
  push:
    branches: [openipc-rockchip]
  pull_request:
    branches: [openipc-rockchip]

jobs:
  build:
    # @ci/rockchip until build-rockchip.yml is on openipc (its PR), then
    # @openipc as the other vendors' callers
    uses: OpenIPC/u-boot/.github/workflows/build-rockchip.yml@ci/rockchip
    # github.sha: on pull_request the merge of the PR into the current
    # base, so the PR is built as it would land; on push, that commit.
    with:
      ref: ${{ github.sha }}
    # A called workflow is validated against what its caller grants,
    # skipped jobs included; release asks for this.
    permissions:
      contents: write
