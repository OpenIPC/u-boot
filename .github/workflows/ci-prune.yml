name: Prune CI markers

# A green pull request run into openipc-<vendor> leaves
# refs/ci/built/<vendor>/<tree> (see .github/scripts/ci-select.py,
# built_ref) so that the push landing it need not build the same tree
# again. That push comes within days; a marker is only ever read by it.
# Markers older than that are dead weight in every `git ls-remote`, so they
# are deleted here. Deleting one early costs one rebuild, never coverage.
#
# Age is the marked commit's committer date: the pull request's merge
# commit, made when its run started.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Delete markers older than this many days
        default: "30"

permissions:
  contents: write

concurrency:
  group: ci-prune

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old refs/ci/built markers
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.days || '30' }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "days: not a number: $DAYS" >&2; exit 1 ;; esac
          cutoff=$(date -u -d "$DAYS days ago" +%s)
          kept=0 deleted=0 failed=0
          gh api --paginate "repos/$REPO/git/matching-refs/ci/built/" \
            --jq '.[] | "\(.ref) \(.object.sha)"' > markers.txt
          while read -r ref sha; do
            date=$(gh api "repos/$REPO/git/commits/$sha" --jq .committer.date) || date=
            if [ -n "$date" ] && [ "$(date -u -d "$date" +%s)" -ge "$cutoff" ]; then
              kept=$((kept + 1))
              continue
            fi
            if gh api -X DELETE "repos/$REPO/git/$ref" --silent; then
              echo "deleted $ref (${date:-commit unreadable})"
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < markers.txt
          echo "markers: $deleted deleted, $kept kept, $failed failed" |
            tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
