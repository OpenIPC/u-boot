name: Build axera

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-axera.  Code changes reach it through
  # workflow_call from the caller on openipc-axera, which passes the revision
  # to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-axera.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-axera revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to this repo's Axera release
        type: boolean
        default: false
      # Publishing to OpenIPC/firmware is off for now: see the publish job.
#      publish:
#        description: Publish to OpenIPC/firmware latest and report to openipc.org
#        type: boolean
#        default: false

# The shape of build-sigmastar.yml:
#   resolve -> build (matrix, one target per leg) + qemu (prep) ->
#   qemu_smoke, qemu_smoke_ax630c (hard gates) -> release (own, `release`
#   input);
#   publish (OpenIPC/firmware latest + openipc.org report) is commented out:
#   these images have booted only in QEMU, never on silicon.
# build.sh takes targets (<soc>-<flash>) as arguments; the matrix calls it
# with one per leg.
#
# Nothing private is needed. Each image is one file written at flash 0,
# first stage included, built from source in the tree (openipc/ax620e-spl,
# openipc/ax620u-spl):
#   AX620E: u-boot-ax620e-nor.bin, the boot partition (first stage, then
#     U-Boot packed at 0x10000)
#   AX620U: u-boot-ax620u-nand.bin, the boot partition of OpenIPC's NAND
#     layout (first stage and its copy, then U-Boot at 0x40000); before
#     that, the cameras' 1 MiB spl partition and boot (U-Boot at 0x100000)
#   AX630C: u-boot-ax630c-emmc.bin, U-Boot alone for now (no first stage
#     yet): the board's own bootloader loads it from the SD card and starts
#     it at 0x50000000
# A target the revision does not have (no openipc/<soc>_config: a target
# added here before its code reached openipc-axera) is not built: its leg
# uploads a marker instead of the image, the smoke test skips it and the
# release has the other targets.
# u-boot-<soc>-stockspl.bin is the same with the cameras' own first stage,
# kept in the tree as a fallback: a separate artifact, smoke-tested, not
# released. The release has u-boot-<soc>.bin only.
# build.sh fetches the SDK's ax_gzip (AX620E) from a public SDK copy at a
# fixed commit, checked against its SHA-256.

jobs:
  # Resolve the openipc-axera revision this run builds from. The workflow
  # lives on the openipc branch, so github.sha is the openipc commit, not
  # the revision being built; release provenance must name the commit that
  # build.sh actually compiled.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-axera' }}
          path: src

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # AX620U (Cortex-A7, AArch32): SPI NAND, the boot partition
          # from 0, up to the environment
          - { soc: ax620u-nand }
          # AX620E (Cortex-A53, AArch64): SPI NOR, the 256 KiB boot
          # partition at 0 (first stage, then packed U-Boot at 0x10000)
          - { soc: ax620e-nor }
          # AX630C (Cortex-A53, AArch64): eMMC and SD card (Sipeed
          # MaixCAM2). No first stage yet: U-Boot alone, which the board's
          # own bootloader starts from the SD card; smoke-tested by
          # qemu_smoke_ax630c, which starts it with QEMU's loader.
          - { soc: ax630c-emmc }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release names, even if the branch
          # moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      # A target the revision does not have is not built (see the top)
      - name: Check the revision has ${{ matrix.soc }}
        id: target
        run: |
          if [ -f 'openipc/${{ matrix.soc }}_config' ]; then
            echo build=1 >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.soc }}: no openipc/${{ matrix.soc }}_config in this revision, not built"
            echo build=0 >> "$GITHUB_OUTPUT"
            mkdir -p output
            echo "not built by this revision" > output/u-boot-none.txt
          fi

      - name: Install dependencies
        if: ${{ steps.target.outputs.build == '1' }}
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi gcc-aarch64-linux-gnu \
              device-tree-compiler bison flex bc libssl-dev python3 curl
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done

      # build.sh's defaults: CROSS_COMPILE=arm-linux-gnueabi- (AX620U),
      # CROSS_COMPILE_64=aarch64-linux-gnu- (AX620E, AX630C)
      - name: Build ${{ matrix.soc }}
        if: ${{ steps.target.outputs.build == '1' }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        if: ${{ steps.target.outputs.build == '1' }}
        run: |
          # An image larger than its boot partition overflows into the
          # environment and bricks the camera on upgrade. build.sh checks
          # this too (axera-image.py against the mtdparts, ax620e-image.py
          # against CONFIG_ENV_OFFSET); this is the gate on the artifact.
          f='output/u-boot-${{ matrix.soc }}.bin'
          [ -f "$f" ] || { echo "missing $f" >&2; exit 1; }
          # Compare bytes: rounding down to KiB would pass an image up to
          # 1023 bytes into the environment. The limit is where the
          # revision's own environment starts (its CONFIG_ENV_OFFSET): the
          # image is everything before it.
          limit=$(sed -n 's/^CONFIG_ENV_OFFSET=//p' 'output/build-${{ matrix.soc }}/.config')
          [ -n "$limit" ] || { echo "no CONFIG_ENV_OFFSET in the build's .config" >&2; exit 1; }
          limit=$((limit))
          rc=0
          check() {
            size=$(stat -c %s "$1")
            echo "- $1: [${size}/$2 bytes]"
            if [ "$size" -gt "$2" ]; then
              echo "-- size exceeded by: $((size - $2)) bytes" >&2
              rc=1
            fi
          }
          # The image and its stock-first-stage twin
          for f in output/u-boot-${{ matrix.soc }}*.bin; do
            check "$f" "$limit"
          done
          exit $rc

      # u-boot-<soc>: the image the release takes (its *.bin), or the
      # marker of a target the revision does not have
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: |
            output/u-boot-${{ matrix.soc }}.bin
            output/u-boot-none.txt
          if-no-files-found: error

      # stockspl-<soc>: the same with the cameras' first stage, for the
      # smoke test (and anyone who wants it from the run); not released.
      # A revision that does not build it uploads a marker saying so, so
      # the smoke test tells that from a failed download.
      - name: Mark a missing stock-first-stage image
        run: |
          f='output/u-boot-${{ matrix.soc }}-stockspl.bin'
          [ -f "$f" ] || echo "not built by this revision" > output/stockspl-none.txt

      - name: Upload stock-first-stage artifact
        uses: actions/upload-artifact@v4
        with:
          name: stockspl-${{ matrix.soc }}
          path: |
            output/u-boot-${{ matrix.soc }}-stockspl.bin
            output/stockspl-none.txt
          if-no-files-found: error

  # Build qemu-system-aarch64 once for the smoke legs.
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-aarch64
        # OpenIPC/qemu-bench master at a fixed commit, which has the
        # ax620e machine with its axera-spi-nor env-from-flash property,
        # a reset command ending a flash session (#351, which the
        # source-built AX620E first stage needs) and the AX620Q eFuse by
        # default (#346, chip=), and the ax620u machine
        env:
          QEMU_REPO: https://github.com/OpenIPC/qemu-bench
          QEMU_REF: e84387fb05ef3c5b42dfb10da6b170e965785034
        run: |
          git init -q qemu-bench
          cd qemu-bench
          git remote add origin "$QEMU_REPO"
          git fetch -q --depth 1 origin "$QEMU_REF"
          git checkout -q "$QEMU_REF"
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-aarch64 "$GITHUB_WORKSPACE/qemu-aarch64"
          chmod +x "$GITHUB_WORKSPACE/qemu-aarch64"

      - name: Upload qemu-aarch64
        uses: actions/upload-artifact@v4
        with:
          name: qemu-aarch64
          path: qemu-aarch64

  # QEMU smoke test, each SoC with each first stage (`spl`: source, or the
  # cameras' own, stock), the image at 0 of otherwise erased flash:
  #   AX620E: a 16 MiB NOR on qemu-bench's `-M ax620e`, which runs the
  #     first stage from flash 0; it unpacks U-Boot from 0x10000 with the
  #     GZIPD engine model.
  #   AX620U: a 128 MiB SPI NAND on `-M ax620u`, which starts the first
  #     stage at flash 0x800 (it does not model the boot ROM or DDR
  #     training); the first stage loads U-Boot from 0x40000 (from
  #     0x100000 in the cameras' layout, which earlier revisions build).
  # It must reach the autoboot prompt, then, after `reset` (the
  # watchdog), reach it again having loaded the environment the first
  # boot saved: the models keep flash writes in memory across a reset, not
  # in the file, so both boots are one QEMU run.
  #
  # A leg whose image the revision does not build (no -stockspl, or an
  # AX620U image of U-Boot alone, from before it carried the first stage)
  # is skipped with a warning, except the AX620E source one, the image
  # that has always been there.
  qemu_smoke:
    needs: [build, qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { soc: ax620e-nor, machine: ax620e, spl: source }
          - { soc: ax620e-nor, machine: ax620e, spl: stock }
          - { soc: ax620u-nand, machine: ax620u, spl: source }
          - { soc: ax620u-nand, machine: ax620u, spl: stock }
    steps:
      - name: Download qemu-aarch64
        uses: actions/download-artifact@v4
        with:
          name: qemu-aarch64

      - name: Download u-boot artifact
        if: ${{ matrix.spl == 'source' }}
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Download stock-first-stage artifact
        if: ${{ matrix.spl == 'stock' }}
        uses: actions/download-artifact@v4
        with:
          name: stockspl-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-aarch64 is built once in the `qemu` job and downloaded
          # here, so this leg needs the shared libraries it links against.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0
          if ldd ./qemu-aarch64 | grep -qi 'not found'; then
            echo "qemu-aarch64 has unresolved libraries:" >&2
            ldd ./qemu-aarch64 >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 3
        run: |
          case '${{ matrix.spl }}' in
            source) IMG='u-boot-${{ matrix.soc }}.bin' ;;
            stock) IMG='u-boot-${{ matrix.soc }}-stockspl.bin' ;;
          esac
          skip() {
            echo "::warning::$1: ${{ matrix.machine }} with the ${{ matrix.spl }} first stage not tested"
            exit 0
          }
          if [ ! -f "$IMG" ]; then
            # only the build's own marker excuses a missing image
            [ '${{ matrix.spl }}' = stock ] && [ -f stockspl-none.txt ] &&
              skip "$IMG not built by this revision"
            echo "missing $IMG" >&2
            exit 1
          fi
          # The flash, erased but for the image at 0: AX620E 16 MiB NOR,
          # AX620U 128 MiB SPI NAND. env-from-flash (AX620E): serve the
          # environment from the flash image, not the model's synthetic one.
          case '${{ matrix.machine }}' in
            ax620e)
              SIZE_MB=16
              MACHINE_ARGS='-global axera-spi-nor.env-from-flash=on' ;;
            ax620u)
              SIZE_MB=128
              MACHINE_ARGS=
              # The first stage's two headers, U-Boot's at 0x40000 (OpenIPC's
              # layout) or at 0x100000 (the cameras', earlier revisions):
              # the image to test (0). U-Boot alone behind its header, at
              # most the boot partition, is what openipc-axera built before
              # the image carried the first stage (2): skipped. Anything
              # else is a broken image (1).
              rc=0
              python3 - "$IMG" <<'PY' || rc=$?
          import sys
          d = open(sys.argv[1], 'rb').read()
          magic = bytes.fromhex('22335455')
          if d[4:8] == magic and d[:0x400] == d[0x400:0x800]:
              for uboot in (0x40000, 0x100000):
                  if len(d) > uboot + 0x400 and d[uboot + 4:uboot + 8] == magic:
                      sys.exit(0)
          if len(d) <= 0x180000 and d[4:8] == magic and d[:0x400] != d[0x400:0x800]:
              sys.exit(2)
          sys.exit(1)
          PY
              case $rc in
                0) ;;
                2) skip "$IMG is U-Boot alone, from before the image carried the first stage" ;;
                *) echo "$IMG: not an AX620U image (headers at 0, 0x400, and 0x40000 or 0x100000)" >&2; exit 1 ;;
              esac ;;
          esac
          set -- "$IMG" 0
          echo "booting $* on -M ${{ matrix.machine }}"
          python3 - /tmp/flash.bin $((SIZE_MB << 20)) "$@" <<'PY'
          import sys
          img = bytearray(b'\xff' * int(sys.argv[2]))
          for f, off in zip(sys.argv[3::2], sys.argv[4::2]):
              u = open(f, 'rb').read()
              img[int(off):int(off) + len(u)] = u
          open(sys.argv[1], 'wb').write(img)
          PY
          chmod +x ./qemu-aarch64
          mkfifo /tmp/uart.in /tmp/uart.out
          ./qemu-aarch64 -M ${{ matrix.machine }},flash-file=/tmp/flash.bin \
            $MACHINE_ARGS \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          cat /tmp/uart.out > /tmp/uboot.txt &
          CAT_PID=$!
          exec 3>/tmp/uart.in
          # Wait for the n-th autoboot prompt, not the banner: the banner
          # prints before the board init that can hang. Up to 30 s.
          prompt() {
            for i in $(seq 1 60); do
              [ "$(grep -c 'Hit Ctrl-C' /tmp/uboot.txt 2>/dev/null)" -ge "$1" ] && return 0
              sleep 0.5
            done
            return 1
          }
          rc=0
          if prompt 1; then
            # Ctrl-C a few times: one that lands after the countdown
            # stops the TFTP fetch bootcmd starts instead
            for i in 1 2 3 4; do printf '\003' >&3; sleep 0.3; done
            printf 'reset\r' >&3
            prompt 2 || rc=2
          else
            rc=1
          fi
          exec 3>&-
          kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          if [ "$rc" != 0 ]; then
            echo "FAIL: boot $rc did not reach the autoboot prompt"
            echo
            echo "== qemu stderr =="
            tail -40 /tmp/qemu.log || true
            exit 1
          fi
          # The first boot finds an erased environment and saves the
          # default one; the second must load it back
          if [ "$(grep -c 'Warning - bad CRC' /tmp/uboot.txt)" != 1 ]; then
            echo "FAIL: the environment saved on the first boot did not load after reset"
            exit 1
          fi
          echo "PASS: u-boot (${{ matrix.spl }} first stage) reached the autoboot prompt, and its saved environment survived a reset"

  # QEMU smoke test of the AX630C image, U-Boot alone: qemu-bench's
  # `-M ax620e,chip=ax630c` with QEMU's loader starting it at 0x50000000
  # (in EL1, as the OpenIPC first stage would; no first stage or boot ROM
  # runs), a blank 256 MiB eMMC and a card whose FAT p1 has an `Image` but
  # no device tree, firmware that cannot boot. It must reach the autoboot
  # prompt, stay at the prompt rather than reset (one banner; a failed
  # load once reset every boot), and list the eMMC and the card. QEMU's
  # eMMC has no 1.8 V and the image's device tree asks for it, so U-Boot
  # has no environment device there: the environment's save and reload
  # are not tested.
  # A revision without the target (the build's marker) is skipped with a
  # warning.
  qemu_smoke_ax630c:
    needs: [build, qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOC: ax630c-emmc
    steps:
      - name: Download qemu-aarch64
        uses: actions/download-artifact@v4
        with:
          name: qemu-aarch64

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ env.SOC }}

      - name: Install QEMU runtime deps
        run: |
          sudo apt-get update -qq
          # dosfstools: the card's FAT
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0 dosfstools
          if ldd ./qemu-aarch64 | grep -qi 'not found'; then
            echo "qemu-aarch64 has unresolved libraries:" >&2
            ldd ./qemu-aarch64 >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 3
        run: |
          IMG="u-boot-$SOC.bin"
          if [ ! -f "$IMG" ]; then
            # only the build's own marker excuses a missing image
            if [ -f u-boot-none.txt ]; then
              echo "::warning::$IMG not built by this revision: not tested"
              exit 0
            fi
            echo "missing $IMG" >&2
            exit 1
          fi
          truncate -s 256M /tmp/emmc.img
          # The card: an MBR, FAT16 p1 from 1 MiB with one file, IMAGE
          # (8.3, no long name), not a kernel; no device tree
          truncate -s 32M /tmp/p1.img
          mkfs.vfat -F 16 /tmp/p1.img > /dev/null
          python3 - /tmp/sd.img /tmp/p1.img <<'PY'
          import struct, sys
          sd, p1 = sys.argv[1:3]
          v = bytearray(open(p1, 'rb').read())
          bps, spc, rsvd, nfats, nroot = struct.unpack_from('<HBHBH', v, 11)
          fatsz = struct.unpack_from('<H', v, 22)[0]
          root = (rsvd + nfats * fatsz) * bps
          data = root + nroot * 32
          body = b'not a kernel\n'
          e = next(o for o in range(root, data, 32) if v[o] == 0)
          v[e:e + 32] = (b'IMAGE      ' + bytes([0x20]) + bytes(14) +
                         struct.pack('<HI', 2, len(body)))
          for i in range(nfats):
              struct.pack_into('<H', v, (rsvd + i * fatsz) * bps + 4, 0xffff)
          v[data:data + len(body)] = body
          mbr = bytearray(1 << 20)
          mbr[446:462] = struct.pack('<B3sB3sII', 0, b'\0\0\0', 0x0e,
                                     b'\0\0\0', 2048, len(v) // 512)
          mbr[510:512] = b'\x55\xaa'
          open(sd, 'wb').write(mbr + v)
          PY
          # QEMU takes only a power-of-2 card size
          truncate -s 64M /tmp/sd.img
          chmod +x ./qemu-aarch64
          mkfifo /tmp/uart.in /tmp/uart.out
          ./qemu-aarch64 -M ax620e,chip=ax630c -m 1G -smp 1 \
            -device loader,file="$IMG",addr=0x50000000,cpu-num=0 \
            -drive if=sd,index=0,file=/tmp/emmc.img,format=raw \
            -drive if=sd,index=1,file=/tmp/sd.img,format=raw \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          cat /tmp/uart.out > /tmp/uboot.txt &
          CAT_PID=$!
          exec 3>/tmp/uart.in
          # Wait for text in the output, up to 30 s
          wait_for() {
            for i in $(seq 1 60); do
              grep -qF "$1" /tmp/uboot.txt 2>/dev/null && return 0
              sleep 0.5
            done
            return 1
          }
          rc=0
          if ! wait_for 'Hit Ctrl-C'; then
            rc=1
          elif ! wait_for 'staying at the prompt'; then
            rc=2
          else
            sleep 1
            printf 'mmc list\r' >&3
            wait_for 'mmc@104e0000: 1 (SD)' || rc=3
            # a reset would be a second banner by now
            sleep 3
          fi
          exec 3>&-
          kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          case $rc in
            0) ;;
            1) echo "FAIL: U-Boot did not reach the autoboot prompt" ;;
            2) echo "FAIL: bootcmd did not stay at the prompt with no bootable firmware" ;;
            3) echo "FAIL: mmc list did not list the eMMC and the SD controller" ;;
          esac
          if [ "$rc" = 0 ] && ! grep -q 'mmc@1b40000: 0' /tmp/uboot.txt; then
            echo "FAIL: mmc list did not list the eMMC"
            rc=3
          fi
          if [ "$rc" = 0 ] && [ "$(grep -c '^U-Boot 20' /tmp/uboot.txt)" != 1 ]; then
            echo "FAIL: U-Boot reset instead of staying at the prompt"
            rc=4
          fi
          if [ "$rc" != 0 ]; then
            echo
            echo "== qemu stderr =="
            tail -40 /tmp/qemu.log || true
            exit 1
          fi
          echo "PASS: u-boot ($SOC) reached the autoboot prompt and, with no bootable firmware on the card or the eMMC, stayed at the prompt"

  # Mirror every built image to this repository's own Axera release.
  release:
    needs: [resolve, build, qemu_smoke, qemu_smoke_ax630c]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axera
          name: Axera
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # Off for now: images go only to this repository's own Axera release.
  # Neither image has run on silicon, only on qemu-bench's machines (the
  # AX620U one with a camera's SPL in the flash), and nothing in
  # OpenIPC/firmware `latest` is an Axera U-Boot yet. Uncomment the job and
  # the `publish` input once an image has booted on a camera; openipc.org
  # accepts the report only from workflows it allowlists (OpenIPC/website
  # service/internal/builds/verify.go), so add build-axera.yml there first.
  # The concurrency group, shared with the other build-*.yml, keeps a second
