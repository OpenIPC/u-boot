name: Build rockchip

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-rockchip.  Code changes reach it through
  # workflow_call from the caller on openipc-rockchip, which passes the
  # revision to build.  Only workflow_dispatch can release.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-rockchip.yml
      - .github/scripts/ci-select.py
      - .github/ci/rockchip.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-rockchip revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to this repo's Rockchip release
        type: boolean
        default: false
      # Publishing to OpenIPC/firmware is off: see the end of this file.

# The shape of build-axera.yml:
#   resolve -> build (matrix, one SoC name per leg) + qemu ->
#   qemu_smoke (hard gate) -> release (own, `release` input).
# build.sh takes SoC names as arguments and builds each as a NOR and a
# NAND image, u-boot-<soc>-<flash>.bin: the boot partition, written at
# flash 0, its ID block (rkbin's DDR-init blob, in the tree, and the SPL)
# and u-boot.itb behind it. Nothing private is needed.
#   NOR: the ID block at 0x8000, everything before the environment at
#     0x40000
#   NAND: the ID block in blocks 0 and 1, u-boot.itb at 0x40000, within
#     the 768 KiB boot partition (OpenIPC's 768k(boot),256k(env),-(ubi))
# The RV1103 is built from the RV1106's sources and the RV1109 from the
# RV1126's; only CONFIG_PRODUCT_SOC differs, which picks the file
# `run ubwrite` fetches.
# A SoC the revision does not build (not in build.sh's ALL_SOCS: a SoC
# added here before its code reached openipc-rockchip) is not built: its
# leg uploads a marker instead of the images, the smoke test skips it and
# the release has the others.

# One run per pull request: a new push to it cancels the run it replaces,
# which used to go on to completion beside it (12 such overlaps in the five
# days before this). Dispatched runs release and publish, so they queue
# behind each other instead and are never cancelled; neither is a push.
# The group names the vendor: in a called workflow github.workflow is the
# caller's ("CI"), the same on every branch.
concurrency:
  group: build-rockchip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the openipc-rockchip revision this run builds from, and pick the
  # legs it builds. The workflow itself lives on the openipc branch, so
  # github.sha is the openipc commit, not the revision being built; release
  # provenance must name the commit that build.sh actually compiled.
  #
  # The legs come from .github/scripts/ci-select.py over .github/ci/rockchip.yml
  # (the matrices' one copy): a change no leg owns builds every leg, docs
  # build none, a push whose tree its pull request already built green builds
  # none. A dispatch always builds every leg. See the script for the rules.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      build_matrix: ${{ steps.select.outputs.build_matrix }}
      smoke_matrix: ${{ steps.select.outputs.smoke_matrix }}
      needs_build: ${{ steps.select.outputs.needs_build }}
      needs_smoke: ${{ steps.select.outputs.needs_smoke }}
      needs_qemu: ${{ steps.select.outputs.needs_qemu }}
      legs: ${{ steps.select.outputs.legs }}
      marker: ${{ steps.select.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-rockchip' }}
          path: src
          # Two deep: on a pull request, the merge commit and the base it
          # was merged onto, which is what the change is.
          fetch-depth: 2

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The selector and the matrices live on openipc beside this workflow.
      # A pull request into openipc tests its own copy of them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'openipc' && github.sha || 'openipc' }}
          path: ci
          sparse-checkout: .github

      - name: Select legs
        id: select
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          python3 ci/.github/scripts/ci-select.py rockchip --src src

  build:
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release names, even if the branch
          # moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      # A SoC the revision does not build is not built (see the top)
      - name: Check the revision has ${{ matrix.soc }}
        id: target
        run: |
          if [ -f build.sh ] &&
             grep -Eq '^ALL_SOCS=".*\b${{ matrix.soc }}\b' build.sh; then
            echo build=1 >> "$GITHUB_OUTPUT"
          else
            echo "::warning::${{ matrix.soc }}: not in this revision's build.sh, not built"
            echo build=0 >> "$GITHUB_OUTPUT"
            mkdir -p output
            echo "not built by this revision" > output/u-boot-none.txt
          fi

      - name: Install dependencies
        if: ${{ steps.target.outputs.build == '1' }}
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          # binman: swig and python3-dev for pylibfdt, pyelftools, and
          # lzma_alone for the LZMA-compressed u-boot.itb
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi device-tree-compiler \
              bison flex bc libssl-dev python3 python3-dev \
              python3-setuptools python3-pyelftools swig lzma-alone
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done

      # build.sh's default: CROSS_COMPILE=arm-linux-gnueabi-
      - name: Build ${{ matrix.soc }}
        if: ${{ steps.target.outputs.build == '1' }}
        run: sh build.sh ${{ matrix.soc }}

      - name: Check partition fit
        if: ${{ steps.target.outputs.build == '1' }}
        run: |
          # An image larger than its boot partition overflows into the
          # environment and bricks the camera on upgrade. build.sh checks
          # this too; this is the gate on the artifact. The limit is where
          # each build's own environment starts (its CONFIG_ENV_OFFSET):
          # 0x40000 on NOR, 0xc0000 on NAND. Compare bytes: rounding down
          # to KiB would pass an image up to 1023 bytes into it.
          rc=0
          for flash in nor nand; do
            f="output/u-boot-${{ matrix.soc }}-$flash.bin"
            [ -f "$f" ] || { echo "missing $f" >&2; rc=1; continue; }
            limit=$(sed -n 's/^CONFIG_ENV_OFFSET=//p' \
                    "output/build-${{ matrix.soc }}-$flash/.config")
            [ -n "$limit" ] || { echo "no CONFIG_ENV_OFFSET for $f" >&2; rc=1; continue; }
            size=$(stat -c %s "$f")
            echo "- $f: [${size}/$((limit)) bytes]"
            if [ "$size" -gt $((limit)) ]; then
              echo "-- size exceeded by: $((size - limit)) bytes" >&2
              rc=1
            fi
          done
          exit $rc

      # u-boot-<soc>: the two images the release takes, or the marker of a
      # SoC the revision does not build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: |
            output/u-boot-${{ matrix.soc }}-nor.bin
            output/u-boot-${{ matrix.soc }}-nand.bin
            output/u-boot-none.txt
          if-no-files-found: error

  # Build qemu-system-arm once for the smoke legs.
  qemu:
    needs: resolve
    if: needs.resolve.outputs.needs_qemu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The QEMU build is minutes of every run and its source rarely moves.
      # Keyed on the source commit and the runner image, it is built once
      # and restored after that; caches written by the dispatches on openipc
      # are visible to every branch's runs. Source: https://github.com/OpenIPC/qemu-bench at QEMU_REF.
      - name: QEMU source and runner image
        id: qsrc
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "rev=9d4c1a447b0574a60a78229acd2b01482c152029" >> "$GITHUB_OUTPUT"

      - name: Cache the QEMU build
        id: qcache
        uses: actions/cache@v4
        with:
          path: |
            qemu-arm
          key: qemu-arm-${{ steps.qsrc.outputs.image }}-${{ steps.qsrc.outputs.rev }}-v1

      - name: Install QEMU build deps
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm
        if: steps.qcache.outputs.cache-hit != 'true'
        # OpenIPC/qemu-bench at a fixed commit with the rv1106, rv1103,
        # rv1103b, rv1126 and rv1109 machines, the CRU's global soft reset
        # (U-Boot's `reset`), the RV1126's v1 ID block and flash-type=
        # picking NOR or NAND (OpenIPC/qemu-bench#380)
        env:
          QEMU_REPO: https://github.com/OpenIPC/qemu-bench
          QEMU_REF: 9d4c1a447b0574a60a78229acd2b01482c152029
        run: |
          git init -q qemu-bench
          cd qemu-bench
          git remote add origin "$QEMU_REPO"
          git fetch -q --depth 1 origin "$QEMU_REF"
          git checkout -q "$QEMU_REF"
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Upload qemu-arm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: qemu-arm

  # QEMU smoke test, every image on its SoC's qemu-bench machine, which
  # stands in for the mask ROM (it skips the DDR blob and starts the SPL
  # from the ID block), at 0 of otherwise erased flash:
  #   NOR: a 16 MiB mx25l12805d
  #   NAND: a 128 MiB w25n01gv (RV1106, RV1103B), a 256 MiB gd5f2gq4ub
  #     (RV1126, the RV1109 camera's part)
  # It must reach the autoboot prompt; probe the Ethernet MAC and get an
  # address by DHCP and an answer to ping from QEMU's user network; then,
  # after `reset` (the CRU's global soft reset), reach the prompt again
  # having loaded the environment the first boot saved. The models keep
  # flash writes in memory across a reset, so both boots are one QEMU run.
  # A SoC the revision does not build (the build's marker) is skipped with
  # a warning. The ID-block offsets the real mask ROM accepts are not
  # tested: qemu-bench's stand-in tries several.
  qemu_smoke:
    needs: [resolve, build, qemu]
    if: needs.resolve.outputs.needs_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.smoke_matrix) }}
    steps:
      - name: Download qemu-arm
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-arm is built once in the `qemu` job and downloaded here,
          # so this leg needs the shared libraries it links against.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0
          if ldd ./qemu-arm | grep -qi 'not found'; then
            echo "qemu-arm has unresolved libraries:" >&2
            ldd ./qemu-arm >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 8
        run: |
          SOC='${{ matrix.soc }}'
          IMG="u-boot-$SOC-${{ matrix.flash }}.bin"
          if [ ! -f "$IMG" ]; then
            # only the build's own marker excuses a missing image
            if [ -f u-boot-none.txt ]; then
              echo "::warning::$IMG not built by this revision: not tested"
              exit 0
            fi
            echo "missing $IMG" >&2
            exit 1
          fi
          case '${{ matrix.flash }}' in
            nor) SIZE_MB=16; PART=mx25l12805d ;;
            nand)
              case $SOC in
                rv1126|rv1109) SIZE_MB=256; PART=gd5f2gq4ub ;;
                *) SIZE_MB=128; PART=w25n01gv ;;
              esac ;;
          esac
          python3 - /tmp/flash.bin $((SIZE_MB << 20)) "$IMG" <<'PY'
          import sys
          img = bytearray(b'\xff' * int(sys.argv[2]))
          u = open(sys.argv[3], 'rb').read()
          img[:len(u)] = u
          open(sys.argv[1], 'wb').write(img)
          PY
          chmod +x ./qemu-arm
          mkfifo /tmp/uart.in /tmp/uart.out
          ./qemu-arm -M "$SOC,flash-file=/tmp/flash.bin,flash-type=$PART" \
            -nic user -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          cat /tmp/uart.out > /tmp/uboot.txt &
          CAT_PID=$!
          exec 3>/tmp/uart.in
          # Wait for the n-th occurrence of a text, up to 3 minutes: the
          # NOR images scan the flash for firmware before the prompt
          wait_for() {
            for i in $(seq 1 360); do
              [ "$(grep -c "$2" /tmp/uboot.txt 2>/dev/null)" -ge "$1" ] && return 0
              sleep 0.5
            done
            return 1
          }
          send() { printf '%s\r' "$1" >&3; }
          rc=0
          if wait_for 1 'Hit Ctrl-C'; then
            # Ctrl-C a few times: one that lands after the countdown stops
            # the boot command instead
            for i in 1 2 3 4; do printf '\003' >&3; sleep 0.3; done
            send 'setenv autoload no'
            sleep 0.5
            send 'dhcp'
            wait_for 1 'DHCP client bound' || rc=3
            send 'ping 10.0.2.2'
            [ $rc = 0 ] && { wait_for 1 'is alive' || rc=4; }
            send 'reset'
            [ $rc = 0 ] && { wait_for 2 'Hit Ctrl-C' || rc=2; }
          else
            rc=1
          fi
          exec 3>&-
          kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          case $rc in
            0) ;;
            1|2) echo "FAIL: boot $rc did not reach the autoboot prompt" ;;
            3) echo "FAIL: no DHCP lease" ;;
            4) echo "FAIL: ping 10.0.2.2 got no answer" ;;
          esac
          if [ $rc = 0 ] && ! grep -q 'eth0: ethernet@' /tmp/uboot.txt; then
            echo "FAIL: the Ethernet MAC did not probe"
            rc=5
          fi
          # The first boot finds an erased environment and saves the
          # default one; the second must load it back
          if [ $rc = 0 ] && [ "$(grep -c 'Warning - bad CRC' /tmp/uboot.txt)" != 1 ]; then
            echo "FAIL: the environment saved on the first boot did not load after reset"
            rc=6
          fi
          if [ $rc != 0 ]; then
            echo
            echo "== qemu stderr =="
            tail -40 /tmp/qemu.log || true
            exit 1
          fi
          echo "PASS: $IMG reached the autoboot prompt, got DHCP and a ping answer, and its saved environment survived a reset"

  # Replace this repository's own Rockchip release with this run's images.
  release:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One release at a time: two dispatches would interleave their uploads
    concurrency:
      group: release-rockchip
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      # The release is this run's images and nothing else, its tag on the
      # commit they were built from: uploading over the old one would keep
      # images this revision does not build, and the tag would stay where
      # it was first made.
      - name: Remove the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view rockchip -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete rockchip -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rockchip
          name: Rockchip
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # No publish job: images go only to this repository's own Rockchip
  # release. None has run on silicon, only on qemu-bench's machines; the
  # mask ROM's ID-block offsets in particular are unverified. Add a
  # publish job (as build-hisilicon.yml has it, with openipc.org's
  # allowlist in OpenIPC/website service/internal/builds/verify.go) once
  # an image has booted on a camera.

  # Leave the marker the push that lands this pull request looks for
  # (ci-select.py, built_ref): this tree was built and smoke-tested green, so
  # that push need not build it again. Squash-merging onto an unmoved base
  # gives the push the very tree this pull request built. A fork's read-only
  # token cannot write it; the push then builds, as it did before.
  mark_built:
    needs: [resolve, build, qemu_smoke]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.resolve.outputs.marker != ''
      && needs.build.result == 'success'
      && (needs.qemu_smoke.result == 'success'
          || (needs.qemu_smoke.result == 'skipped' && needs.resolve.outputs.needs_smoke != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the tree as built
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ needs.resolve.outputs.marker }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="$MARKER" -f sha="$SHA" --jq .ref ||
          gh api -X PATCH "repos/${{ github.repository }}/git/$MARKER" \
            -f sha="$SHA" -F force=true --jq .ref
