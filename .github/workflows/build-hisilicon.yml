name: Build hisilicon

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-hisilicon.  Code changes reach it through
  # workflow_call from the caller on openipc-hisilicon, which passes the
  # revision to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
  workflow_call:
    inputs:
      ref:
        description: openipc-hisilicon revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to the Hisilicon release and to OpenIPC/firmware
        type: boolean
        default: false

# Mirrors the CI shape of OpenIPC/u-boot-xmedia:
#   build (matrix, every SoC) -> qemu (prep) -> qemu_smoke (hard gate) ->
#   release (own) + publish (OpenIPC/firmware latest + openipc.org report).
# build.sh takes SoCs as arguments and builds every supported SoC when
# invoked with none; the matrix calls it with exactly one SoC per leg.

jobs:
  # Resolve the openipc-hisilicon revision this run builds from. The
  # workflow itself lives on the openipc branch, so github.sha is the
  # openipc commit, not the revision being built; release provenance
  # must name the commit that build.sh actually compiled.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-hisilicon' }}
          path: src

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- NOR + NAND ---
          - { soc: hi3516cv500, kinds: "nor nand", files: "output/u-boot-hi3516cv500-*.bin" }
          - { soc: hi3516dv300, kinds: "nor nand", files: "output/u-boot-hi3516dv300-*.bin" }
          - { soc: hi3516av300, kinds: "nor nand", files: "output/u-boot-hi3516av300-*.bin" }
          - { soc: gk7201v200, kinds: "nor nand", files: "output/u-boot-gk7201v200-*.bin" }
          - { soc: gk7201v300, kinds: "nor nand", files: "output/u-boot-gk7201v300-*.bin" }
          - { soc: gk7205v200, kinds: "nor nand", files: "output/u-boot-gk7205v200-*.bin" }
          - { soc: gk7205v300, kinds: "nor nand", files: "output/u-boot-gk7205v300-*.bin" }
          - { soc: gk7202v300, kinds: "nor nand", files: "output/u-boot-gk7202v300-*.bin" }
          - { soc: gk7605v100, kinds: "nor nand", files: "output/u-boot-gk7605v100-*.bin" }
          - { soc: hi3516dv200, kinds: "nor nand", files: "output/u-boot-hi3516dv200-*.bin" }
          - { soc: hi3516ev200, kinds: "nor nand", files: "output/u-boot-hi3516ev200-*.bin" }
          - { soc: hi3516ev300, kinds: "nor nand", files: "output/u-boot-hi3516ev300-*.bin" }
          - { soc: hi3518ev300, kinds: "nor nand", files: "output/u-boot-hi3518ev300-*.bin" }
          - { soc: gk7205v500, kinds: "nor nand", files: "output/u-boot-gk7205v500-*.bin" }
          - { soc: gk7205v510, kinds: "nor nand", files: "output/u-boot-gk7205v510-*.bin" }
          - { soc: gk7205v530, kinds: "nor nand", files: "output/u-boot-gk7205v530-*.bin" }
          # --- NOR only ---
          - { soc: hi3516cv610, kinds: "nor", files: "output/boot-hi3516cv610-*-nor.bin" }
          - { soc: hi3516cv608, kinds: "nor", files: "output/boot-hi3516cv608-nor.bin" }
          - { soc: hi3516cv200, kinds: "nor", files: "output/u-boot-hi3516cv200-nor.bin" }
          - { soc: hi3518ev200, kinds: "nor", files: "output/u-boot-hi3518ev200-nor.bin" }
          - { soc: hi3516cv300, kinds: "nor", files: "output/u-boot-hi3516cv300-nor.bin" }
          - { soc: hi3516ev100, kinds: "nor", files: "output/u-boot-hi3516ev100-nor.bin" }
          - { soc: hi3516av200, kinds: "nor", files: "output/u-boot-hi3516av200-nor.bin" }
          - { soc: hi3519v101, kinds: "nor", files: "output/u-boot-hi3519v101-nor.bin" }
          - { soc: hi3515av100, kinds: "nor", files: "output/u-boot-hi3515av100-nor.bin" }
          - { soc: hi3520av100, kinds: "nor", files: "output/u-boot-hi3520av100-nor.bin" }
          - { soc: hi3520dv100, kinds: "nor", files: "output/u-boot-hi3520dv100-nor.bin" }
          - { soc: hi3520dv200, kinds: "nor", files: "output/u-boot-hi3520dv200-nor.bin" }
          - { soc: hi3536cv100, kinds: "nor", files: "output/u-boot-hi3536cv100-nor.bin" }
          - { soc: hi3536dv100, kinds: "nor", files: "output/u-boot-hi3536dv100-nor.bin" }
          - { soc: hi3516av100, kinds: "nor", files: "output/u-boot-hi3516av100-nor.bin" }
          - { soc: hi3516dv100, kinds: "nor", files: "output/u-boot-hi3516dv100-nor.bin" }
          - { soc: hi3518av100, kinds: "nor", files: "output/u-boot-hi3518av100-nor.bin" }
          - { soc: hi3518cv100, kinds: "nor", files: "output/u-boot-hi3518cv100-nor.bin" }
          - { soc: hi3518ev100, kinds: "nor", files: "output/u-boot-hi3518ev100-nor.bin" }
          - { soc: hi3516cv100, kinds: "nor", files: "output/u-boot-hi3516cv100-nor.bin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-hisilicon' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi u-boot-tools device-tree-compiler \
              bison flex bc lzop libssl-dev python3 python3-pip
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done
          python3 -m pip install --upgrade pip
          python3 -m pip install pycryptodome
          # vendor recipes rely on bash features when invoked as /bin/sh
          sudo ln -sf /bin/bash /bin/sh

      - name: Build ${{ matrix.soc }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        run: |
          # Boot partition sizes from this tree's mtdparts: NOR boot = 256 KiB
          # (env at 0x40000), NAND/UBI boot = 768 KiB (0xc0000). An image
          # larger than its boot partition overflows into env and bricks the
          # device on upgrade.
          soc='${{ matrix.soc }}'
          kinds='${{ matrix.kinds }}'
          rc=0
          check_kind() {
            kind=$1
            limit_kb=$2
            pattern=$3
            found=0
            for f in $pattern; do
              [ -f "$f" ] || continue
              found=1
              size_kb=$(( $(stat -c %s "$f") / 1024 ))
              echo "- $f: [${size_kb}KB/${limit_kb}KB]"
              if [ "$size_kb" -gt "$limit_kb" ]; then
                echo "-- size exceeded by: $((size_kb - limit_kb))KB" >&2
                rc=1
              fi
            done
            [ "$found" = 1 ] || { echo "missing ${kind} image for ${soc} (${pattern})" >&2; rc=1; }
          }
          check_kind nor 256 "output/*${soc}*-nor.bin"
          case "$kinds" in
            *nand*) check_kind nand 768 "output/*${soc}*-nand.bin" ;;
          esac
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Build qemu-system-arm once and share it with every smoke leg (30 SoCs).
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Upload qemu-arm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: qemu-arm

  # QEMU smoke test — boots each freshly-built NOR u-boot in the matching
  # qemu-hisilicon machine model and asserts it prints a u-boot banner.
  # Every SoC with a machine model is a hard gate on publish; the six
  # without one (hi3518ev200, hi3516ev100, hi3515av100, hi3520av100,
  # hi3520dv100, gk7201v300) have no smoke leg.
  qemu_smoke:
    needs: [build, qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        soc:
          - hi3516cv500
          - hi3516dv300
          - hi3516av300
          - hi3516cv610
          - hi3516cv608
          - hi3516cv200
          - hi3516cv300
          - hi3516av200
          - hi3519v101
          - hi3520dv200
          - hi3536cv100
          - hi3536dv100
          - hi3516av100
          - hi3516dv100
          - hi3518av100
          - hi3518cv100
          - hi3518ev100
          - hi3516cv100
          - gk7201v200
          - gk7205v200
          - gk7205v300
          - gk7202v300
          - gk7605v100
          - hi3516dv200
          - hi3516ev200
          - hi3516ev300
          - hi3518ev300
          - gk7205v500
          - gk7205v510
          - gk7205v530
    steps:
      - name: Download qemu-arm
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-arm is built once in the `qemu` job and downloaded here,
          # so this leg needs the shared libraries it links against. Same
          # package set the donor repo installs before running its smoke
          # test, so the runtime matches what the binary was built with.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv
          if ldd ./qemu-arm | grep -qi 'not found'; then
            echo "qemu-arm has unresolved libraries:" >&2
            ldd ./qemu-arm >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 2
        run: |
          soc='${{ matrix.soc }}'
          UBOOT=$(ls u-boot-${soc}-nor.bin boot-${soc}*-nor.bin 2>/dev/null | head -1)
          test -n "$UBOOT"
          echo "booting $UBOOT"
          dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
          dd if="$UBOOT" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
          mkfifo /tmp/uart.in /tmp/uart.out
          chmod +x ./qemu-arm
          ./qemu-arm \
            -M ${soc},flash-file=/tmp/flash.bin \
            -nographic -serial pipe:/tmp/uart \
            -monitor none > /tmp/qemu.log 2>&1 &
          QEMU_PID=$!
          timeout 10 cat /tmp/uart.out > /tmp/uboot.txt || true
          kill "$QEMU_PID" 2>/dev/null || true
          wait 2>/dev/null || true
          echo "== captured u-boot output =="
          cat /tmp/uboot.txt
          echo
          if grep -qE 'U-Boot |Hit Ctrl-C|CPU:|DRAM:|Board:' /tmp/uboot.txt; then
            echo "PASS: u-boot booted past startup"
          else
            echo "FAIL: u-boot did not print a recognised banner"
            echo
            echo "== qemu stderr =="
            tail -40 /tmp/qemu.log || true
            exit 1
          fi

  # Mirror every built image to this repository's own Hisilicon release.
  release:
    needs: [resolve, build]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hisilicon
          name: Hisilicon
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # Publish every NOR/NAND image to the OpenIPC/firmware `latest` release
  # and tell openipc.org what was uploaded. openipc.org builds its
  # full-flash downloads from those binaries and refuses any whose size
  # and sha256 differ from its record, so a report must describe exactly
  # the bytes `latest` holds. The concurrency group keeps a second run
  # from uploading between this run's upload and its report.
  publish:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-firmware-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          # Releases API occasionally returns 502/503. Retry with backoff:
          # 10s, 20s, 30s, 40s — total ~100s before giving up.
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          find artifacts -type f -name '*.bin' | sort | while read -r f; do
            echo "publishing $f"
            upload "$f"
          done

      # The push script is OpenIPC/firmware's, at a fixed commit: the only
      # code this job checks out, since it holds an id-token.
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: 7fa63ce694cb5d27c19d4f19058ba2c044849db4
          sparse-checkout: .github/scripts
          path: firmware

      # The contract is PUSH.md in OpenIPC/website (source `uboot`, release
      # `latest`, one id per run). The digests are of the files uploaded
      # above, hashed here, so the push describes exactly those bytes.
      - name: Report to openipc.org
        env:
          HISI_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -eu
          mkdir published
          find artifacts -type f -name '*.bin' -exec cp {} published/ \;
          python3 firmware/.github/scripts/push_build.py \
            --source uboot \
            --build-id "uboot-$(date -u +%Y%m%dT%H%M%SZ)-${HISI_SHA::7}" \
            --release latest \
            --sha "$HISI_SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --assets 'published/*.bin'
