name: Build hisilicon

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-hisilicon.  Code changes reach it through
  # workflow_call from the caller on openipc-hisilicon, which passes the
  # revision to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-hisilicon.yml
      - .github/scripts/ci-select.py
      - .github/ci/hisilicon.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-hisilicon revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      # Two switches: OpenIPC/firmware `latest` also carries -nor/-nand
      # images that u-boot-xmedia and u-boot-hi3516cv6xx publish under the
      # same names, so refreshing this repo's own release must not
      # replace those by default.
      release:
        description: Publish to this repo's Hisilicon and Goke releases
        type: boolean
        default: false
      publish:
        description: Publish to OpenIPC/firmware latest and report to openipc.org (replaces same-named images from other repos)
        type: boolean
        default: false

# Mirrors the CI shape of OpenIPC/u-boot-xmedia:
#   build (matrix, every SoC) -> qemu (prep) -> qemu_smoke (hard gate) ->
#   release (own, `release` input) + publish (OpenIPC/firmware latest +
#   openipc.org report, `publish` input).
# build.sh takes SoCs as arguments and builds every supported SoC when
# invoked with none; the matrix calls it with exactly one SoC per leg.

# One run per pull request: a new push to it cancels the run it replaces,
# which used to go on to completion beside it (12 such overlaps in the five
# days before this). Dispatched runs release and publish, so they queue
# behind each other instead and are never cancelled; neither is a push.
# The group names the vendor: in a called workflow github.workflow is the
# caller's ("CI"), the same on every branch.
concurrency:
  group: build-hisilicon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the openipc-hisilicon revision this run builds from, and pick the
  # legs it builds. The workflow itself lives on the openipc branch, so
  # github.sha is the openipc commit, not the revision being built; release
  # provenance must name the commit that build.sh actually compiled.
  #
  # The legs come from .github/scripts/ci-select.py over .github/ci/hisilicon.yml
  # (the matrices' one copy): a change no leg owns builds every leg, docs
  # build none, a push whose tree its pull request already built green builds
  # none. A dispatch always builds every leg. See the script for the rules.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      build_matrix: ${{ steps.select.outputs.build_matrix }}
      smoke_matrix: ${{ steps.select.outputs.smoke_matrix }}
      needs_build: ${{ steps.select.outputs.needs_build }}
      needs_smoke: ${{ steps.select.outputs.needs_smoke }}
      needs_qemu: ${{ steps.select.outputs.needs_qemu }}
      legs: ${{ steps.select.outputs.legs }}
      marker: ${{ steps.select.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-hisilicon' }}
          path: src
          # Two deep: on a pull request, the merge commit and the base it
          # was merged onto, which is what the change is.
          fetch-depth: 2

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The selector and the matrices live on openipc beside this workflow.
      # A pull request into openipc tests its own copy of them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'openipc' && github.sha || 'openipc' }}
          path: ci
          sparse-checkout: .github

      - name: Select legs
        id: select
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          python3 ci/.github/scripts/ci-select.py hisilicon --src src

  build:
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release and openipc.org report name,
          # even if the branch moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The .debs, cached: every leg installed the same ~94 MB from the
      # runner's mirror, and that mirror stalls -- a 13 MB package sat for
      # three minutes, the attempt was killed, and with 40-odd legs a run
      # rarely finished without one of them timing out. With the cache warm
      # there is nothing to download. Keyed on the image, so a new image
      # starts a new cache rather than restoring packages it may not want;
      # bump the trailing version when the package list below changes.
      # ImageOS/ImageVersion are the runner's environment, which the
      # expression context cannot see: read them in a shell.
      - name: Runner image
        id: image
        run: echo "id=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache apt archives
        uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ steps.image.outputs.id }}-${{ matrix.soc == 'hi3519dv500' && 'arm64' || 'arm' }}-v1

      - name: Install dependencies
        timeout-minutes: 25
        run: |
          # apt mirrors on hosted runners intermittently hang on the
          # mirrorlist fetch, not just fail: each attempt keeps its own
          # `timeout`, so a hang is killed and the retry actually fires.
          # Only hi3519dv500 is arm64; the other legs need no aarch64 compiler,
          # which was half of what each of them downloaded.
          cross=gcc-arm-linux-gnueabi
          [ "${{ matrix.soc }}" = hi3519dv500 ] && cross="$cross gcc-aarch64-linux-gnu"
          mkdir -p ~/apt-archives/partial
          # A stalled download should fail over to the next mirror in the
          # runner's mirrorlist, not sit until the attempt is killed: apt's
          # default wait is two minutes per connection.
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 -o Dir::Cache::Archives=$HOME/apt-archives"
          install() {
            sudo timeout 180 apt-get $apt_opts update && \
            sudo timeout 300 apt-get $apt_opts install -y --no-install-recommends \
              build-essential $cross \
              u-boot-tools device-tree-compiler \
              bison flex bc lzop libssl-dev python3 python3-pip
          }
          # A slow mirror trickles rather than going idle, so the timeouts
          # above do not move apt off it: a retry points the runner's
          # mirrorlist (which its sources read) at another mirror instead.
          mirrors="http://archive.ubuntu.com/ubuntu/ http://mirrors.edge.kernel.org/ubuntu/"
          for i in 1 2 3; do
            install && break
            [ "$i" = 3 ] && { echo "apt failed after 3 attempts" >&2; exit 1; }
            m=$(echo $mirrors | cut -d' ' -f$i)
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s from $m" >&2
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "$m" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            else
              sudo sed -i "s|http://azure.archive.ubuntu.com/ubuntu/\?|$m|g" \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            fi
            sleep $((i*10))
          done
          # apt ran as root; the cache step saves as the runner user.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          python3 -m pip install --upgrade pip
          python3 -m pip install pycryptodome
          # vendor recipes rely on bash features when invoked as /bin/sh
          sudo ln -sf /bin/bash /bin/sh

      - name: Build ${{ matrix.soc }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        run: |
          # Boot partition sizes from this tree's mtdparts: NOR boot = 256 KiB
          # (env at 0x40000) unless the leg says otherwise (nor_kb: hi3519dv500's
          # is 512 KiB, env at 0x80000), NAND/UBI boot = 768 KiB (0xc0000). An image
          # larger than its boot partition overflows into env and bricks the
          # device on upgrade.
          soc='${{ matrix.soc }}'
          kinds='${{ matrix.kinds }}'
          rc=0
          check_kind() {
            kind=$1
            limit_kb=$2
            pattern=$3
            found=0
            for f in $pattern; do
              [ -f "$f" ] || continue
              found=1
              # In bytes: a size rounded down to KiB let an image up to
              # 1023 bytes over its partition through.
              size=$(stat -c %s "$f")
              limit=$((limit_kb * 1024))
              echo "- $f: [$((size / 1024))KB/${limit_kb}KB] ($size/$limit bytes)"
              if [ "$size" -gt "$limit" ]; then
                echo "-- size exceeded by: $((size - limit)) bytes" >&2
                rc=1
              fi
            done
            [ "$found" = 1 ] || { echo "missing ${kind} image for ${soc} (${pattern})" >&2; rc=1; }
          }
          check_kind nor ${{ matrix.nor_kb || 256 }} "output/*${soc}*-nor.bin"
          case "$kinds" in
            *nand*) check_kind nand 768 "output/*${soc}*-nand.bin" ;;
          esac
          exit $rc

      # A held SoC's artifact is named hold-u-boot-<soc>, which the
      # release and publish jobs' u-boot-* download pattern skips.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.hold && 'hold-' || '' }}u-boot-${{ matrix.soc }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Build qemu-system-arm and -aarch64 once and share them with every smoke
  # leg (31 SoCs; hi3519dv500 is the aarch64 one).
  qemu:
    needs: resolve
    if: needs.resolve.outputs.needs_qemu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The QEMU build is minutes of every run and its source rarely moves.
      # Keyed on the source commit and the runner image, it is built once
      # and restored after that; caches written by the dispatches on openipc
      # are visible to every branch's runs. Source: https://github.com/widgetii/qemu-hisilicon master.
      - name: QEMU source and runner image
        id: qsrc
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          rev=$(git ls-remote https://github.com/widgetii/qemu-hisilicon refs/heads/master | cut -f1)
          echo "rev=${rev:-unpinned-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Cache the QEMU build
        id: qcache
        uses: actions/cache@v4
        with:
          path: |
            qemu-arm
            qemu-aarch64
          key: qemu-arm-aarch64-${{ steps.qsrc.outputs.image }}-${{ steps.qsrc.outputs.rev }}-v1

      - name: Install QEMU build deps
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm and qemu-system-aarch64
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch master \
            https://github.com/widgetii/qemu-hisilicon qemu-hisilicon
          cd qemu-hisilicon
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          cp qemu-src/build/qemu-system-aarch64 "$GITHUB_WORKSPACE/qemu-aarch64"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm" "$GITHUB_WORKSPACE/qemu-aarch64"

      - name: Upload qemu-arm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: |
            qemu-arm
            qemu-aarch64

  # QEMU smoke test — boots each freshly-built NOR u-boot in the matching
  # qemu-hisilicon machine model and asserts it prints a u-boot banner.
  # Every SoC with a machine model is a hard gate on publish; the ones
  # without (hi3518ev200, hi3516ev100, hi3515av100, hi3520av100,
  # hi3520dv100, gk7201v300, gk7206v11a, gk7206v12a) have no smoke leg.
  qemu_smoke:
    needs: [resolve, build, qemu]
    if: needs.resolve.outputs.needs_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.smoke_matrix) }}
    steps:
      - name: Download qemu-arm
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-arm is built once in the `qemu` job and downloaded here,
          # so this leg needs the shared libraries it links against. Same
          # package set the donor repo installs before running its smoke
          # test, so the runtime matches what the binary was built with.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv
          for q in ./qemu-arm ./qemu-aarch64; do
            if ldd "$q" | grep -qi 'not found'; then
              echo "$q has unresolved libraries:" >&2
              ldd "$q" >&2
              exit 1
            fi
          done

      - name: Smoke-test in QEMU
        timeout-minutes: 6
        run: |
          soc='${{ matrix.soc }}'
          # hi3519dv500 is the one arm64 machine model.
          QEMU=./qemu-arm
          [ "$soc" = hi3519dv500 ] && QEMU=./qemu-aarch64
          chmod +x ./qemu-arm ./qemu-aarch64

          # Every NOR image the leg built and would publish, plus the NAND
          # boot images: the boot-image SoCs have one per board (hi3516cv610:
          # five, hi3519dv500: two NOR and two NAND). The machine models carry
          # no NAND chip, so a NAND boot image probes "0 MiB" and still has to
          # reach the prompt. The u-boot-*-nand.bin builds are not booted.
          smoke() {
            img=$1
            echo "== booting $img =="
            rm -f /tmp/flash.bin /tmp/uart.in /tmp/uart.out /tmp/uboot.txt
            dd if=/dev/zero of=/tmp/flash.bin bs=1M count=8 2>/dev/null
            dd if="$img" of=/tmp/flash.bin bs=1 conv=notrunc 2>/dev/null
            mkfifo /tmp/uart.in /tmp/uart.out
            "$QEMU" \
              -M ${soc},flash-file=/tmp/flash.bin \
              -nographic -serial pipe:/tmp/uart \
              -monitor none > /tmp/qemu.log 2>&1 &
            QEMU_PID=$!
            # Wait for the autoboot prompt, not the banner: the banner prints
            # before the board init that can hang. hi3516cv100/hi3518av100
            # passed on "U-Boot " while stuck in the NAND probe right after it.
            # Up to 30 s, done as soon as the prompt shows.
            cat /tmp/uart.out > /tmp/uboot.txt &
            CAT_PID=$!
            for i in $(seq 1 60); do
              grep -q 'Hit Ctrl-C' /tmp/uboot.txt 2>/dev/null && break
              sleep 0.5
            done
            kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
            wait 2>/dev/null || true
            echo "== captured u-boot output =="
            cat /tmp/uboot.txt
            echo
            if grep -q 'Hit Ctrl-C' /tmp/uboot.txt; then
              echo "PASS: $img reached the autoboot prompt"
            else
              echo "FAIL: $img did not reach the autoboot prompt"
              echo
              echo "== qemu stderr =="
              tail -40 /tmp/qemu.log || true
              return 1
            fi
          }

          rc=0
          n=0
          for img in u-boot-${soc}-nor.bin boot-${soc}*-nor.bin boot-${soc}*-nand.bin; do
            [ -f "$img" ] || continue
            n=$((n + 1))
            smoke "$img" || rc=1
          done
          [ "$n" -gt 0 ] || { echo "no NOR image for ${soc}" >&2; exit 1; }
          exit $rc

  # Mirror every built image to this repository's own releases, one per
  # vendor: the HiSilicon hi* images to Hisilicon, the Goke gk* ones to Goke.
  release:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to the Hisilicon release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hisilicon
          name: Hisilicon
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: |
            artifacts/**/u-boot-hi*.bin
            artifacts/**/boot-hi*.bin
          fail_on_unmatched_files: true

      - name: Upload to the Goke release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: goke
          name: Goke
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/u-boot-gk*.bin
          fail_on_unmatched_files: true

  # Publish every NOR/NAND image to the OpenIPC/firmware `latest` release
  # and tell openipc.org what was uploaded. openipc.org builds its
  # full-flash downloads from those binaries and refuses any whose size
  # and sha256 differ from its record, so a report must describe exactly
  # the bytes `latest` holds. The concurrency group keeps a second run
  # from uploading between this run's upload and its report.
  publish:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-firmware-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          # Releases API occasionally returns 502/503. Retry with backoff:
          # 10s, 20s, 30s, 40s — total ~100s before giving up.
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          find artifacts -type f -name '*.bin' | sort | while read -r f; do
            echo "publishing $f"
            upload "$f"
          done

      # The push script is OpenIPC/firmware's, at a fixed commit: the only
      # code this job checks out, since it holds an id-token.
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: 7fa63ce694cb5d27c19d4f19058ba2c044849db4
          sparse-checkout: .github/scripts
          path: firmware

      # The contract is PUSH.md in OpenIPC/website (source `uboot`, release
      # `latest`, one id per run). The digests are of the files uploaded
      # above, hashed here, so the push describes exactly those bytes.
      - name: Report to openipc.org
        env:
          HISI_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -eu
          mkdir published
          find artifacts -type f -name '*.bin' -exec cp {} published/ \;
          python3 firmware/.github/scripts/push_build.py \
            --source uboot \
            --build-id "uboot-$(date -u +%Y%m%dT%H%M%SZ)-${HISI_SHA::7}" \
            --release latest \
            --sha "$HISI_SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --assets 'published/*.bin'

  # Leave the marker the push that lands this pull request looks for
  # (ci-select.py, built_ref): this tree was built and smoke-tested green, so
  # that push need not build it again. Squash-merging onto an unmoved base
  # gives the push the very tree this pull request built. A fork's read-only
  # token cannot write it; the push then builds, as it did before.
  mark_built:
    needs: [resolve, build, qemu_smoke]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.resolve.outputs.marker != ''
      && needs.build.result == 'success'
      && (needs.qemu_smoke.result == 'success'
          || (needs.qemu_smoke.result == 'skipped' && needs.resolve.outputs.needs_smoke != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the tree as built
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ needs.resolve.outputs.marker }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="$MARKER" -f sha="$SHA" --jq .ref ||
          gh api -X PATCH "repos/${{ github.repository }}/git/$MARKER" \
            -f sha="$SHA" -F force=true --jq .ref
