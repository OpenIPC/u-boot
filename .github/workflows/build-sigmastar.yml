name: Build sigmastar

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-sigmastar.  Code changes reach it through
  # workflow_call from the caller on openipc-sigmastar, which passes the revision
  # to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-sigmastar.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-sigmastar revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to this repo's SigmaStar release
        type: boolean
        default: false
      # Publishing to OpenIPC/firmware is off for now: see the publish job.
#      publish:
#        description: Publish to OpenIPC/firmware latest and report to openipc.org
#        type: boolean
#        default: false

# The shape of build-hisilicon.yml:
#   build (matrix, every SoC) -> qemu (prep) -> qemu_smoke (hard gate) ->
#   release (own, `release` input); publish (OpenIPC/firmware latest +
#   openipc.org report) is commented out for now.
# build.sh takes SoCs as arguments; the matrix calls it with one SoC per leg.

jobs:
  # Resolve the openipc-sigmastar revision this run builds from. The workflow
  # lives on the openipc branch, so github.sha is the openipc commit, not
  # the revision being built; release provenance must name the commit that
  # build.sh actually compiled.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-sigmastar' }}
          path: src

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { soc: msc313e, files: "output/u-boot-msc313e-nor.bin" }
          - { soc: msc316dc, files: "output/u-boot-msc316dc-nor.bin" }
          - { soc: msc316dm, files: "output/u-boot-msc316dm-nor.bin" }
          - { soc: ssc029a-nand, files: "output/u-boot-ssc029a-nand.bin" }
          - { soc: ssc029a, files: "output/u-boot-ssc029a-nor.bin" }
          - { soc: ssc029b, files: "output/u-boot-ssc029b-nor.bin" }
          - { soc: ssc029c, files: "output/u-boot-ssc029c-nor.bin" }
          - { soc: ssc375, files: "output/u-boot-ssc375-nor.bin" }
          - { soc: ssc034a, files: "output/u-boot-ssc034a-nor.bin" }
          - { soc: ssc034b, files: "output/u-boot-ssc034b-nor.bin" }
          - { soc: ssc034a-nand, files: "output/u-boot-ssc034a-nand.bin" }
          - { soc: ssc034b-nand, files: "output/u-boot-ssc034b-nand.bin" }
          - { soc: ssc30kd-nand, files: "output/u-boot-ssc30kd-nand.bin" }
          - { soc: ssc30kd, files: "output/u-boot-ssc30kd-nor.bin" }
          - { soc: ssc30kq-nand, files: "output/u-boot-ssc30kq-nand.bin" }
          - { soc: ssc30kq, files: "output/u-boot-ssc30kq-nor.bin" }
          - { soc: ssc325-nand, files: "output/u-boot-ssc325-nand.bin" }
          - { soc: ssc325, files: "output/u-boot-ssc325-nor.bin" }
          - { soc: ssc325de-nand, files: "output/u-boot-ssc325de-nand.bin" }
          - { soc: ssc325de, files: "output/u-boot-ssc325de-nor.bin" }
          - { soc: ssc327de-nand, files: "output/u-boot-ssc327de-nand.bin" }
          - { soc: ssc327de, files: "output/u-boot-ssc327de-nor.bin" }
          - { soc: ssc333-nand, files: "output/u-boot-ssc333-nand.bin" }
          - { soc: ssc333, files: "output/u-boot-ssc333-nor.bin" }
          - { soc: ssc335-nand, files: "output/u-boot-ssc335-nand.bin" }
          - { soc: ssc335, files: "output/u-boot-ssc335-nor.bin" }
          - { soc: ssc335de-nand, files: "output/u-boot-ssc335de-nand.bin" }
          - { soc: ssc335de, files: "output/u-boot-ssc335de-nor.bin" }
          - { soc: ssc337-nand, files: "output/u-boot-ssc337-nand.bin" }
          - { soc: ssc337, files: "output/u-boot-ssc337-nor.bin" }
          - { soc: ssc337de-nand, files: "output/u-boot-ssc337de-nand.bin" }
          - { soc: ssc337de, files: "output/u-boot-ssc337de-nor.bin" }
          - { soc: ssc338q-nand, files: "output/u-boot-ssc338q-nand.bin" }
          - { soc: ssc338q, files: "output/u-boot-ssc338q-nor.bin" }
          - { soc: ssc377-nand, files: "output/u-boot-ssc377-nand.bin" }
          - { soc: ssc377, files: "output/u-boot-ssc377-nor.bin" }
          - { soc: ssc377d-nand, files: "output/u-boot-ssc377d-nand.bin" }
          - { soc: ssc377d, files: "output/u-boot-ssc377d-nor.bin" }
          - { soc: ssc377de-nand, files: "output/u-boot-ssc377de-nand.bin" }
          - { soc: ssc377de, files: "output/u-boot-ssc377de-nor.bin" }
          - { soc: ssc377qe-nand, files: "output/u-boot-ssc377qe-nand.bin" }
          - { soc: ssc377qe, files: "output/u-boot-ssc377qe-nor.bin" }
          - { soc: ssc378de-nand, files: "output/u-boot-ssc378de-nand.bin" }
          - { soc: ssc378de, files: "output/u-boot-ssc378de-nor.bin" }
          - { soc: ssc378qe-nand, files: "output/u-boot-ssc378qe-nand.bin" }
          - { soc: ssc378qe, files: "output/u-boot-ssc378qe-nor.bin" }
          - { soc: ssd201-nand, files: "output/u-boot-ssd201-nand.bin" }
          - { soc: ssd201, files: "output/u-boot-ssd201-nor.bin" }
          - { soc: ssd202d-nand, files: "output/u-boot-ssd202d-nand.bin" }
          - { soc: ssd202d, files: "output/u-boot-ssd202d-nor.bin" }
          - { soc: ssr621q-nand, files: "output/u-boot-ssr621q-nand.bin" }
          - { soc: ssr621q, files: "output/u-boot-ssr621q-nor.bin" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release and openipc.org report name,
          # even if the branch moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi device-tree-compiler \
              bison flex bc libssl-dev python3
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done

      - name: Build ${{ matrix.soc }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        run: |
          # The boot partition from this tree's mtdparts: NOR boot = 256 KiB
          # (env at 0x40000). An image larger than it overflows into env and
          # bricks the device on upgrade. The image is the whole boot
          # partition: MXP table, the vendor IPL and IPL_CUST, and U-Boot
          # in the 128 KiB MXP partition UBOOT (build.sh checks that fit).
          soc='${{ matrix.soc }}'
          rc=0
          check_kind() {
            kind=$1
            limit_kb=$2
            pattern=$3
            found=0
            for f in $pattern; do
              [ -f "$f" ] || continue
              found=1
              # Compare bytes: rounding down to KiB would pass an image up
              # to 1023 bytes into the environment.
              size=$(stat -c %s "$f")
              limit=$((limit_kb * 1024))
              echo "- $f: [${size}/${limit} bytes]"
              if [ "$size" -gt "$limit" ]; then
                echo "-- size exceeded by: $((size - limit)) bytes" >&2
                rc=1
              fi
            done
            [ "$found" = 1 ] || { echo "missing ${kind} image for ${soc} (${pattern})" >&2; rc=1; }
          }
          # SPI NAND: the 768 KiB boot partition, the environment from
          # 0xC0000 (768k(boot),256k(env),-(ubi), as on openipc-hisilicon)
          case "${soc}" in
            *-nand) check_kind nand 768 "output/u-boot-${soc}.bin" ;;
            *) check_kind nor 256 "output/u-boot-${soc}-nor.bin" ;;
          esac
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Build qemu-system-arm once and share it with every smoke leg.
  qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install QEMU build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm
        # Pinned to the commit of OpenIPC/qemu-bench#242, which adds the
        # ssc029a/b, ssc327de and ssc034a/b machines and Ifliegen's NAND and
        # SD; back to OpenIPC/qemu-bench master once it is merged
        env:
          QEMU_REPO: https://github.com/dimerr/qemu-hisilicon
          QEMU_REF: 1689faa5474894185d34eaea9c41506b5f6ae358
        run: |
          git init -q qemu-hisilicon
          cd qemu-hisilicon
          git remote add origin "$QEMU_REPO"
          git fetch -q --depth 1 origin "$QEMU_REF" || \
            { git fetch -q origin sigmastar-ifliegen-nand; }
          git checkout -q "$QEMU_REF"
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Upload qemu-arm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: qemu-arm

  # QEMU smoke test -- boots each freshly-built image, NOR and SPI NAND,
  # from flash through its own qemu-hisilicon machine, whose mask ROM loads
  # the image's IPL; the vendor stages in the image then bring up DDR and
  # unpack U-Boot. It asserts U-Boot reaches the autoboot prompt, so every
  # leg is a hard gate on release.
  #
  # The second boot must load the environment the first saved, which
  # proves the driver's writes land where its reads find them.
  qemu_smoke:
    needs: [build, qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every leg, on its own machine: the bond strap where the vendor
        # IPL refuses the machine's default (ssc029b on ssc029; the
        # infinity6e NAND IPLs past QFN88)
        include:
          - { soc: msc313e, machine: "msc313e", medium: nor }
          - { soc: msc316dc, machine: "msc316dc", medium: nor }
          - { soc: msc316dm, machine: "msc316dm", medium: nor }
          - { soc: ssd201, machine: "ssd201", medium: nor }
          - { soc: ssd202d, machine: "ssd202d", medium: nor }
          - { soc: ssr621q, machine: "ssr621q", medium: nor }
          - { soc: ssc325, machine: "ssc325", medium: nor }
          - { soc: ssc325de, machine: "ssc325de", medium: nor }
          - { soc: ssc327de, machine: "ssc327de", medium: nor }
          - { soc: ssc333, machine: "ssc333", medium: nor }
          - { soc: ssc335, machine: "ssc335", medium: nor }
          - { soc: ssc335de, machine: "ssc335de", medium: nor }
          - { soc: ssc337, machine: "ssc337", medium: nor }
          - { soc: ssc337de, machine: "ssc337de", medium: nor }
          - { soc: ssc30kd, machine: "ssc30kd", medium: nor }
          - { soc: ssc30kq, machine: "ssc30kq", medium: nor }
          - { soc: ssc338q, machine: "ssc338q", medium: nor }
          - { soc: ssc377, machine: "ssc377", medium: nor }
          - { soc: ssc377d, machine: "ssc377d", medium: nor }
          - { soc: ssc377de, machine: "ssc377de", medium: nor }
          - { soc: ssc377qe, machine: "ssc377qe", medium: nor }
          - { soc: ssc378de, machine: "ssc378de", medium: nor }
          - { soc: ssc378qe, machine: "ssc378qe", medium: nor }
          - { soc: ssc029a, machine: "ssc029a", medium: nor }
          - { soc: ssc029b, machine: "ssc029,bond=0x10", medium: nor }
          - { soc: ssc029c, machine: "ssc029", medium: nor }
          - { soc: ssc375, machine: "ssc375", medium: nor }
          - { soc: ssc034a, machine: "ssc034a", medium: nor }
          - { soc: ssc034b, machine: "ssc034b", medium: nor }
          - { soc: ssd201-nand, machine: "ssd201", medium: nand }
          - { soc: ssd202d-nand, machine: "ssd202d", medium: nand }
          - { soc: ssr621q-nand, machine: "ssr621q", medium: nand }
          - { soc: ssc325-nand, machine: "ssc325", medium: nand }
          - { soc: ssc325de-nand, machine: "ssc325de", medium: nand }
          - { soc: ssc327de-nand, machine: "ssc327de", medium: nand }
          - { soc: ssc333-nand, machine: "ssc333", medium: nand }
          - { soc: ssc335-nand, machine: "ssc335", medium: nand }
          - { soc: ssc335de-nand, machine: "ssc335de", medium: nand }
          - { soc: ssc337-nand, machine: "ssc337", medium: nand }
          - { soc: ssc337de-nand, machine: "ssc337de", medium: nand }
          - { soc: ssc30kd-nand, machine: "ssc30kd,bond=0x10", medium: nand }
          - { soc: ssc30kq-nand, machine: "ssc30kq,bond=0x10", medium: nand }
          - { soc: ssc338q-nand, machine: "ssc338q,bond=0x10", medium: nand }
          - { soc: ssc377-nand, machine: "ssc377", medium: nand }
          - { soc: ssc377d-nand, machine: "ssc377d", medium: nand }
          - { soc: ssc377de-nand, machine: "ssc377de", medium: nand }
          - { soc: ssc377qe-nand, machine: "ssc377qe", medium: nand }
          - { soc: ssc378de-nand, machine: "ssc378de", medium: nand }
          - { soc: ssc378qe-nand, machine: "ssc378qe", medium: nand }
          - { soc: ssc029a-nand, machine: "ssc029a", medium: nand }
          - { soc: ssc034a-nand, machine: "ssc034a", medium: nand }
          - { soc: ssc034b-nand, machine: "ssc034b", medium: nand }
    steps:
      - name: Download qemu-arm
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-arm is built once in the `qemu` job and downloaded here,
          # so this leg needs the shared libraries it links against.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0
          if ldd ./qemu-arm | grep -qi 'not found'; then
            echo "qemu-arm has unresolved libraries:" >&2
            ldd ./qemu-arm >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 3
        run: |
          soc='${{ matrix.soc }}'
          MACHINE='${{ matrix.machine }}'
          case '${{ matrix.medium }}' in
            nor) UBOOT="u-boot-${soc}-nor.bin" ;;
            nand) UBOOT="u-boot-${soc}.bin" ;;
          esac
          test -f "$UBOOT"
          echo "booting $UBOOT on -M $MACHINE"
          # NOR: 8 MiB (infinity3) or 16 MiB, U-Boot at 0, the rest erased.
          # SPI NAND: 128 MiB of 2048-byte pages, each with its 64 spare
          # bytes, the boot area at 0 and the rest erased.
          python3 - "$UBOOT" /tmp/flash.bin '${{ matrix.medium }}' "$soc" <<'PY'
          import sys
          u = open(sys.argv[1], 'rb').read()
          if sys.argv[3] == 'nor':
              img = bytearray(b'\xff' * ((8 if sys.argv[4].startswith('msc') else 16) << 20))
              img[:len(u)] = u
              open(sys.argv[2], 'wb').write(img)
          else:
              with open(sys.argv[2], 'wb') as f:
                  for o in range(0, 128 << 20, 2048):
                      f.write(u[o:o + 2048].ljust(2048, b'\xff') + b'\xff' * 64)
          PY
          FLASH="-M $MACHINE,flash-file=/tmp/flash.bin"
          chmod +x ./qemu-arm
          # Two boots: the first finds an erased environment and saves the
          # default one; the second must load it back.
          for boot in 1 2; do
            mkfifo /tmp/uart.in /tmp/uart.out
            ./qemu-arm $FLASH \
              -nographic -serial pipe:/tmp/uart \
              -monitor none > /tmp/qemu.log 2>&1 &
            QEMU_PID=$!
            # Wait for the autoboot prompt, not the banner: the banner prints
            # before the board init that can hang. Up to 30 s.
            cat /tmp/uart.out > /tmp/uboot$boot.txt &
            CAT_PID=$!
            for i in $(seq 1 60); do
              grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt 2>/dev/null && break
              sleep 0.5
            done
            kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
            wait 2>/dev/null || true
            rm -f /tmp/uart.in /tmp/uart.out
            echo "== boot $boot: captured u-boot output =="
            cat /tmp/uboot$boot.txt
            echo
            if ! grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt; then
              echo "FAIL: boot $boot did not reach the autoboot prompt"
              echo
              echo "== qemu stderr =="
              tail -40 /tmp/qemu.log || true
              exit 1
            fi
          done
          # U-Boot's own warning: infinity6c's IPL reads the environment
          # partition too and prints "env bad CRC" for the format it expects
          if grep -q 'Warning - bad CRC' /tmp/uboot2.txt; then
            echo "FAIL: the environment saved on the first boot did not land"
            exit 1
          fi
          echo "PASS: u-boot reached the autoboot prompt, and its saved environment survived a reset"

  # Mirror every built image to this repository's own SigmaStar release.
  release:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sigmastar
          name: SigmaStar
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # Off for now: images go only to this repository's own SigmaStar release.
  # Uncomment the job and the `publish` input to publish again.
#  # Publish the infinity3 images to the OpenIPC/firmware `latest` release and
#  # tell openipc.org what was uploaded. openipc.org keeps, per file name, the
#  # newest uboot build that names it, so this run adds or refreshes the
#  # u-boot-msc31* names and leaves the other repositories' files alone.
#  #
#  # Only those names: u-boot-ssc* in `latest` are the vendor U-Boot that
#  # OpenIPC/u-boot-sigmastar publishes and cameras in the field flash, and the
