name: Build sigmastar

on:
  # Pull requests against this branch change the workflow itself; they
  # build the current openipc-sigmastar.  Code changes reach it through
  # workflow_call from the caller on openipc-sigmastar, which passes the revision
  # to build.  Only workflow_dispatch can release or publish.
  pull_request:
    branches: [openipc]
    paths:
      - .github/workflows/build-sigmastar.yml
      - .github/scripts/ci-select.py
      - .github/ci/sigmastar.yml
  workflow_call:
    inputs:
      ref:
        description: openipc-sigmastar revision to build
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release:
        description: Publish to this repo's SigmaStar release
        type: boolean
        default: false
      publish:
        description: Publish the targets below to OpenIPC/firmware latest and report them to openipc.org
        type: boolean
        default: false
      # The NOR images of the SoCs openipc.org installs, each booted under
      # OpenIPC/qemu-bench on its own machine. The SigmaStar ones with
      # firmware's current packages: the split image from 0x50000 to login,
      # the split install written by this U-Boot, the fixed slots, and a
      # camera on the vendor U-Boot moved to this one with its overlay kept.
      # The infinity3 ones (msc313e, msc316dc, msc316dm) on the fixed slots
      # only, with local builds of firmware's boards for them: their 3.18
      # kernel cannot split firmware.bin, and firmware published none for
      # them before OpenIPC/firmware#2969. Not NAND: the
      # u-boot-*-nand.bin on `latest` are OpenIPC/u-boot-sigmastar's, in the
      # vendor layout that firmware's NAND packages are built for.
      publish_targets:
        description: Targets to publish (space-separated matrix soc names, NOR only)
        type: string
        default: >-
          msc313e msc316dc msc316dm ssc325 ssc333 ssc335 ssc335de ssc337
          ssc337de ssc30kd ssc30kq ssc338q ssc377 ssc377d ssc377de ssc377qe
          ssc378de ssc378qe

# The shape of build-hisilicon.yml:
#   build (matrix, every SoC) -> qemu (prep) -> qemu_smoke (hard gate) ->
#   release (own, `release` input) + publish (OpenIPC/firmware latest +
#   openipc.org report, `publish` input, only the `publish_targets`).
# build.sh takes SoCs as arguments; the matrix calls it with one SoC per leg.

# One run per pull request: a new push to it cancels the run it replaces,
# which used to go on to completion beside it (12 such overlaps in the five
# days before this). Dispatched runs release and publish, so they queue
# behind each other instead and are never cancelled; neither is a push.
# The group names the vendor: in a called workflow github.workflow is the
# caller's ("CI"), the same on every branch.
concurrency:
  group: build-sigmastar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the openipc-sigmastar revision this run builds from, and pick the
  # legs it builds. The workflow itself lives on the openipc branch, so
  # github.sha is the openipc commit, not the revision being built; release
  # provenance must name the commit that build.sh actually compiled.
  #
  # The legs come from .github/scripts/ci-select.py over .github/ci/sigmastar.yml
  # (the matrices' one copy): a change no leg owns builds every leg, docs
  # build none, a push whose tree its pull request already built green builds
  # none. A dispatch always builds every leg. See the script for the rules.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      build_matrix: ${{ steps.select.outputs.build_matrix }}
      smoke_matrix: ${{ steps.select.outputs.smoke_matrix }}
      needs_build: ${{ steps.select.outputs.needs_build }}
      needs_smoke: ${{ steps.select.outputs.needs_smoke }}
      needs_qemu: ${{ steps.select.outputs.needs_qemu }}
      legs: ${{ steps.select.outputs.legs }}
      marker: ${{ steps.select.outputs.marker }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'openipc-sigmastar' }}
          path: src
          # Two deep: on a pull request, the merge commit and the base it
          # was merged onto, which is what the change is.
          fetch-depth: 2

      - name: Resolve revision
        id: rev
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The selector and the matrices live on openipc beside this workflow.
      # A pull request into openipc tests its own copy of them.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'openipc' && github.sha || 'openipc' }}
          path: ci
          sparse-checkout: .github

      - name: Select legs
        id: select
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --user pyyaml
          python3 ci/.github/scripts/ci-select.py sigmastar --src src

  build:
    needs: resolve
    if: needs.resolve.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The commit resolve recorded, not the ref again: every leg then
          # builds the revision the release and openipc.org report name,
          # even if the branch moves while the matrix runs.
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          # apt mirrors on hosted runners intermittently HANG on the
          # mirrorlist fetch (not just fail). Bound each attempt with its own
          # `timeout` so a hang is killed fast and the retry actually fires.
          install() {
            sudo timeout 180 apt-get update && \
            sudo timeout 240 apt-get install -y --no-install-recommends \
              build-essential gcc-arm-linux-gnueabi device-tree-compiler \
              bison flex bc libssl-dev python3
          }
          for i in 1 2 3 4; do
            install && break
            [ "$i" = 4 ] && { echo "apt failed after 4 attempts" >&2; exit 1; }
            echo "apt attempt $i failed/timed out; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done

      - name: Build ${{ matrix.soc }}
        run: bash build.sh ${{ matrix.soc }}

      - name: Check partition fit
        run: |
          # The boot partition from this tree's mtdparts: NOR boot = 256 KiB
          # (env at 0x40000). An image larger than it overflows into env and
          # bricks the device on upgrade. The image is the whole boot
          # partition: MXP table, the vendor IPL and IPL_CUST, and U-Boot
          # in the 128 KiB MXP partition UBOOT (build.sh checks that fit).
          soc='${{ matrix.soc }}'
          rc=0
          check_kind() {
            kind=$1
            limit_kb=$2
            pattern=$3
            found=0
            for f in $pattern; do
              [ -f "$f" ] || continue
              found=1
              # Compare bytes: rounding down to KiB would pass an image up
              # to 1023 bytes into the environment.
              size=$(stat -c %s "$f")
              limit=$((limit_kb * 1024))
              echo "- $f: [${size}/${limit} bytes]"
              if [ "$size" -gt "$limit" ]; then
                echo "-- size exceeded by: $((size - limit)) bytes" >&2
                rc=1
              fi
            done
            [ "$found" = 1 ] || { echo "missing ${kind} image for ${soc} (${pattern})" >&2; rc=1; }
          }
          # SPI NAND: the 768 KiB boot partition, the environment from
          # 0xC0000 (768k(boot),256k(env),-(ubi), as on openipc-hisilicon)
          case "${soc}" in
            *-nand) check_kind nand 768 "output/u-boot-${soc}.bin" ;;
            *) check_kind nor 256 "output/u-boot-${soc}-nor.bin" ;;
          esac
          exit $rc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # Build qemu-system-arm once and share it with every smoke leg.
  qemu:
    needs: resolve
    if: needs.resolve.outputs.needs_qemu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The QEMU build is minutes of every run and its source rarely moves.
      # Keyed on the source commit and the runner image, it is built once
      # and restored after that; caches written by the dispatches on openipc
      # are visible to every branch's runs. Source: https://github.com/dimerr/qemu-hisilicon at QEMU_REF.
      - name: QEMU source and runner image
        id: qsrc
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "rev=1689faa5474894185d34eaea9c41506b5f6ae358" >> "$GITHUB_OUTPUT"

      - name: Cache the QEMU build
        id: qcache
        uses: actions/cache@v4
        with:
          path: |
            qemu-arm
          key: qemu-arm-${{ steps.qsrc.outputs.image }}-${{ steps.qsrc.outputs.rev }}-v1

      - name: Install QEMU build deps
        if: steps.qcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build meson pkg-config \
            libglib2.0-dev libpixman-1-dev libfdt-dev zlib1g-dev \
            libslirp-dev python3 python3-venv

      - name: Build qemu-system-arm
        if: steps.qcache.outputs.cache-hit != 'true'
        # Pinned to the commit of OpenIPC/qemu-bench#242, which adds the
        # ssc029a/b, ssc327de and ssc034a/b machines and Ifliegen's NAND and
        # SD; back to OpenIPC/qemu-bench master once it is merged
        env:
          QEMU_REPO: https://github.com/dimerr/qemu-hisilicon
          QEMU_REF: 1689faa5474894185d34eaea9c41506b5f6ae358
        run: |
          git init -q qemu-hisilicon
          cd qemu-hisilicon
          git remote add origin "$QEMU_REPO"
          git fetch -q --depth 1 origin "$QEMU_REF" || \
            { git fetch -q origin sigmastar-ifliegen-nand; }
          git checkout -q "$QEMU_REF"
          bash qemu/setup.sh
          cp qemu-src/build/qemu-system-arm "$GITHUB_WORKSPACE/qemu-arm"
          chmod +x "$GITHUB_WORKSPACE/qemu-arm"

      - name: Upload qemu-arm
        uses: actions/upload-artifact@v4
        with:
          name: qemu-arm
          path: qemu-arm

  # QEMU smoke test -- boots each freshly-built image, NOR and SPI NAND,
  # from flash through its own qemu-hisilicon machine, whose mask ROM loads
  # the image's IPL; the vendor stages in the image then bring up DDR and
  # unpack U-Boot. It asserts U-Boot reaches the autoboot prompt, so every
  # leg is a hard gate on release.
  #
  # The second boot must load the environment the first saved, which
  # proves the driver's writes land where its reads find them.
  qemu_smoke:
    needs: [resolve, build, qemu]
    if: needs.resolve.outputs.needs_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.smoke_matrix) }}
    steps:
      - name: Download qemu-arm
        uses: actions/download-artifact@v4
        with:
          name: qemu-arm

      - name: Download u-boot artifact
        uses: actions/download-artifact@v4
        with:
          name: u-boot-${{ matrix.soc }}

      - name: Install QEMU runtime deps
        run: |
          # qemu-arm is built once in the `qemu` job and downloaded here,
          # so this leg needs the shared libraries it links against.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0 libpixman-1-0 libfdt1 zlib1g libslirp0
          if ldd ./qemu-arm | grep -qi 'not found'; then
            echo "qemu-arm has unresolved libraries:" >&2
            ldd ./qemu-arm >&2
            exit 1
          fi

      - name: Smoke-test in QEMU
        timeout-minutes: 3
        run: |
          soc='${{ matrix.soc }}'
          MACHINE='${{ matrix.machine }}'
          case '${{ matrix.medium }}' in
            nor) UBOOT="u-boot-${soc}-nor.bin" ;;
            nand) UBOOT="u-boot-${soc}.bin" ;;
          esac
          test -f "$UBOOT"
          echo "booting $UBOOT on -M $MACHINE"
          # NOR: 8 MiB (infinity3) or 16 MiB, U-Boot at 0, the rest erased.
          # SPI NAND: 128 MiB of 2048-byte pages, each with its 64 spare
          # bytes, the boot area at 0 and the rest erased.
          python3 - "$UBOOT" /tmp/flash.bin '${{ matrix.medium }}' "$soc" <<'PY'
          import sys
          u = open(sys.argv[1], 'rb').read()
          if sys.argv[3] == 'nor':
              img = bytearray(b'\xff' * ((8 if sys.argv[4].startswith('msc') else 16) << 20))
              img[:len(u)] = u
              open(sys.argv[2], 'wb').write(img)
          else:
              with open(sys.argv[2], 'wb') as f:
                  for o in range(0, 128 << 20, 2048):
                      f.write(u[o:o + 2048].ljust(2048, b'\xff') + b'\xff' * 64)
          PY
          FLASH="-M $MACHINE,flash-file=/tmp/flash.bin"
          chmod +x ./qemu-arm
          # Two boots: the first finds an erased environment and saves the
          # default one; the second must load it back.
          for boot in 1 2; do
            mkfifo /tmp/uart.in /tmp/uart.out
            ./qemu-arm $FLASH \
              -nographic -serial pipe:/tmp/uart \
              -monitor none > /tmp/qemu.log 2>&1 &
            QEMU_PID=$!
            # Wait for the autoboot prompt, not the banner: the banner prints
            # before the board init that can hang. Up to 30 s.
            cat /tmp/uart.out > /tmp/uboot$boot.txt &
            CAT_PID=$!
            for i in $(seq 1 60); do
              grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt 2>/dev/null && break
              sleep 0.5
            done
            kill "$QEMU_PID" "$CAT_PID" 2>/dev/null || true
            wait 2>/dev/null || true
            rm -f /tmp/uart.in /tmp/uart.out
            echo "== boot $boot: captured u-boot output =="
            cat /tmp/uboot$boot.txt
            echo
            if ! grep -q 'Hit Ctrl-C' /tmp/uboot$boot.txt; then
              echo "FAIL: boot $boot did not reach the autoboot prompt"
              echo
              echo "== qemu stderr =="
              tail -40 /tmp/qemu.log || true
              exit 1
            fi
          done
          # U-Boot's own warning: infinity6c's IPL reads the environment
          # partition too and prints "env bad CRC" for the format it expects
          if grep -q 'Warning - bad CRC' /tmp/uboot2.txt; then
            echo "FAIL: the environment saved on the first boot did not land"
            exit 1
          fi
          echo "PASS: u-boot reached the autoboot prompt, and its saved environment survived a reset"

  # Mirror every built image to this repository's own SigmaStar release.
  release:
    needs: [resolve, build, qemu_smoke]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      - name: Upload to releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sigmastar
          name: SigmaStar
          target_commitish: ${{ needs.resolve.outputs.sha }}
          prerelease: true
          files: artifacts/**/*.bin
          fail_on_unmatched_files: true

  # Publish the named targets' images to the OpenIPC/firmware `latest`
  # release and tell openipc.org what was uploaded. openipc.org builds its
  # full-flash downloads from those binaries and refuses any whose size and
  # sha256 differ from its record, so a report must describe exactly the
  # bytes `latest` holds; it accepts the report only from this workflow on
  # the openipc branch (its builds pushers list). The concurrency group keeps
  # a second run from uploading between this run's upload and its report.
  publish:
    needs: [resolve, build, qemu_smoke]
    # Only from openipc: the site accepts the report from no other branch,
    # and the upload to `latest` comes before the report.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/openipc' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-firmware-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: u-boot-*

      # Each matrix leg uploads its image as artifact u-boot-<soc>, so the
      # artifact directory names the target. A NAND leg's name has a dash and
      # is refused, and a named target with no artifact stops the publish
      # before anything is uploaded.
      - name: Select the targets to publish
        env:
          TARGETS: ${{ inputs.publish_targets }}
        run: |
          set -eu
          mkdir published
          [ -n "${TARGETS//[[:space:]]/}" ] || { echo "::error::publish_targets is empty" >&2; exit 1; }
          for t in $TARGETS; do
            case "$t" in *[!a-z0-9]*) echo "::error::$t is not a NOR target name" >&2; exit 1 ;; esac
            [ -d "artifacts/u-boot-$t" ] || { echo "::error::no artifact for $t" >&2; exit 1; }
            find "artifacts/u-boot-$t" -type f -name 'u-boot-*-nor.bin' -exec cp {} published/ \;
          done
          ls -l published

      - name: Upload to OpenIPC/firmware latest release
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_RELEASE_TOKEN }}
        run: |
          set -eu
          # Releases API occasionally returns 502/503. Retry with backoff:
          # 10s, 20s, 30s, 40s -- total ~100s before giving up.
          upload() {
            local f="$1" i
            for i in 1 2 3 4 5; do
              if gh release upload latest "$f" --clobber -R OpenIPC/firmware; then
                return 0
              fi
              [ "$i" = "5" ] && return 1
              echo "upload attempt $i failed; sleeping $((i*10))s" >&2
              sleep $((i*10))
            done
          }
          find published -type f -name '*.bin' | sort | while read -r f; do
            echo "publishing $f"
            upload "$f"
          done

      # The push script is OpenIPC/firmware's, at a fixed commit: the only
      # code this job checks out, since it holds an id-token.
      - uses: actions/checkout@v4
        with:
          repository: OpenIPC/firmware
          ref: 7fa63ce694cb5d27c19d4f19058ba2c044849db4
          sparse-checkout: .github/scripts
          path: firmware

      # The contract is PUSH.md in OpenIPC/website (source `uboot`, release
      # `latest`, one id per run). The digests are of the files uploaded
      # above, hashed here, so the push describes exactly those bytes.
      - name: Report to openipc.org
        env:
          SS_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -eu
          python3 firmware/.github/scripts/push_build.py \
            --source uboot \
            --build-id "uboot-sigmastar-$(date -u +%Y%m%dT%H%M%SZ)-${SS_SHA::7}" \
            --release latest \
            --sha "$SS_SHA" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --assets 'published/*.bin'

  # Leave the marker the push that lands this pull request looks for
  # (ci-select.py, built_ref): this tree was built and smoke-tested green, so
  # that push need not build it again. Squash-merging onto an unmoved base
  # gives the push the very tree this pull request built. A fork's read-only
  # token cannot write it; the push then builds, as it did before.
  mark_built:
    needs: [resolve, build, qemu_smoke]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.resolve.outputs.marker != ''
      && needs.build.result == 'success'
      && (needs.qemu_smoke.result == 'success'
          || (needs.qemu_smoke.result == 'skipped' && needs.resolve.outputs.needs_smoke != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the tree as built
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ needs.resolve.outputs.marker }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="$MARKER" -f sha="$SHA" --jq .ref ||
          gh api -X PATCH "repos/${{ github.repository }}/git/$MARKER" \
            -f sha="$SHA" -F force=true --jq .ref
