# The CI matrices of build-ingenic.yml: the one copy, read by
# .github/scripts/ci-select.py, which narrows them to the legs a change
# can reach and hands them to the workflow. Every leg has a `soc`.

build:
  include:
    - { soc: t10, kinds: "nor", files: "output/u-boot-t10-nor.bin" }
    - { soc: t10l, kinds: "nor", files: "output/u-boot-t10l-nor.bin" }
    - { soc: t20, kinds: "nor", files: "output/u-boot-t20-nor.bin" }
